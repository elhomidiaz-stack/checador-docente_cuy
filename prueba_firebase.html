
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171717">
  <title>Checador CUY - Validación</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      background: #171717;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .contenedor {
      width: 100%;
      max-width: 440px;
      padding: 28px;
      background: #242424;
      border: 1px solid #414141;
      border-radius: 16px;
    }

    h1 { margin-top: 0; font-size: 25px; }

    p {
      color: #c9c9c9;
      line-height: 1.5;
    }

    label { display: block; }

    input {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: 1px solid #555;
      border-radius: 8px;
      background: #171717;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #d5a0b9;
      color: #171717;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #estado {
      margin-top: 22px;
      padding: 14px;
      border-radius: 8px;
      background: #333;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .pequeno {
      margin-top: 20px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>

  <main class="contenedor">
    <h1>Checador CUY</h1>

    <p>
      Sistema de autenticación institucional y validación
      de dispositivos móviles.
    </p>

    <div id="formulario">
      <label for="correo">Correo institucional</label>

      <input
        type="email"
        id="correo"
        placeholder="docente@colegiodeyahualica.edu.mx"
        autocomplete="email"
      >

      <button id="btnEnviar">
        Enviar enlace de acceso
      </button>
    </div>

    <div id="estado">Iniciando sistema...</div>

    <p class="pequeno">
      Colegio Universitario de Yahualica · Sistema de asistencia docente
    </p>
  </main>

  <script type="module">

    // ==========================================
    // 1. IMPORTACIONES FIREBASE
    // ==========================================

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

    import {
      getAuth,
      sendSignInLinkToEmail,
      isSignInWithEmailLink,
      signInWithEmailLink,
      onAuthStateChanged
    } from
      "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";


    // ==========================================
    // 2. CONFIGURACIÓN FIREBASE
    // ==========================================

    const firebaseConfig = {
      apiKey: "AIzaSyAMLtZyqiUkME1HwiGSHOFFw7j-UpmBbJI",
      authDomain: "checador-docente-cuy.firebaseapp.com",
      projectId: "checador-docente-cuy",
      storageBucket: "checador-docente-cuy.firebasestorage.app",
      messagingSenderId: "15127097699",
      appId: "1:15127097699:web:308aae0b17e363ad5b2356",
      measurementId: "G-BP8YEFQDJE"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    // ==========================================
    // 3. CONFIGURACIÓN DEL SERVIDOR
    // ==========================================

    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyXlKZuyW8NkhM8Jwut84LDVXCQIsx-8Fa0wZ8Jkcdo57s3ZqAnD9Q0IOXgJvw9AKXY/exec";

    const URL_PAGINA =
      "https://elhomidiaz-stack.github.io/checador-docente_cuy/prueba_firebase.html";

    const CLAVE_CORREO = "firebase_correo_prueba";
    const CLAVE_DISPOSITIVO = "checador_dispositivo_v1";

    const estado = document.getElementById("estado");
    const formulario = document.getElementById("formulario");
    const botonEnviar = document.getElementById("btnEnviar");

    let procesando = false;


    function mostrar(mensaje) {
      estado.textContent = mensaje;
    }


    // ==========================================
    // 4. GENERAR IDENTIFICADOR ALEATORIO
    // ==========================================

    function generarTextoAleatorio(bytes) {
      const valores = new Uint8Array(bytes);
      crypto.getRandomValues(valores);

      let texto = "";

      valores.forEach(valor => {
        texto += String.fromCharCode(valor);
      });

      return btoa(texto)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/g, "");
    }


    // ==========================================
    // 5. RECUPERAR O CREAR DISPOSITIVO
    // ==========================================

    function obtenerDispositivo() {
      const guardado = localStorage.getItem(CLAVE_DISPOSITIVO);

      if (guardado) {
        try {
          const dispositivo = JSON.parse(guardado);

          if (dispositivo.id && dispositivo.token) {
            return dispositivo;
          }

        } catch (error) {
          console.error("Error leyendo dispositivo:", error);
        }
      }

      const dispositivo = {
        id: generarTextoAleatorio(24),
        token: generarTextoAleatorio(32),
        estado: "pendiente"
      };

      localStorage.setItem(
        CLAVE_DISPOSITIVO,
        JSON.stringify(dispositivo)
      );

      return dispositivo;
    }


    // ==========================================
    // 6. IDENTIFICAR TIPO DE TELÉFONO
    // ==========================================

    function identificarTipoTelefono() {
      const agente = navigator.userAgent || "";

      if (/iPhone|iPad|iPod/i.test(agente)) return "iPhone";
      if (/Android/i.test(agente)) return "Android";

      return "Otro dispositivo";
    }


    // ==========================================
    // 7. CONSULTAR RESULTADO DEL SERVIDOR
    // ==========================================

    function consultarResultado(accion, solicitud) {
      return new Promise((resolve, reject) => {

        const callback =
          "respuesta_" +
          crypto.randomUUID().replace(/-/g, "");

        const script = document.createElement("script");
        let terminado = false;

        function limpiar() {
          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }

          delete window[callback];
        }

        const temporizador = setTimeout(() => {
          if (terminado) return;

          terminado = true;
          limpiar();

          reject(new Error("Tiempo de espera agotado."));
        }, 10000);

        window[callback] = resultado => {
          if (terminado) return;

          terminado = true;
          clearTimeout(temporizador);
          limpiar();

          resolve(resultado);
        };

        // El servidor doGet espera el identificador en "id".
        const parametros = new URLSearchParams({
          action: accion,
          id: solicitud,
          callback: callback
        });

        script.src = SCRIPT_URL + "?" + parametros.toString();

        script.onerror = () => {
          if (terminado) return;

          terminado = true;
          clearTimeout(temporizador);
          limpiar();

          reject(new Error("No se pudo consultar el servidor."));
        };

        document.body.appendChild(script);
      });
    }


    // ==========================================
    // 8. ENVIAR SOLICITUD POST
    // ==========================================

    async function enviarSolicitud(datos) {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded;charset=UTF-8"
        },
        body: datos.toString()
      });
    }


    // ==========================================
    // 9. ESPERAR RESULTADO
    // ==========================================

    async function esperarResultado(accion, solicitud) {
      for (let intento = 0; intento < 15; intento++) {

        await new Promise(resolve => setTimeout(resolve, 1000));

        try {
          const resultado = await consultarResultado(
            accion,
            solicitud
          );

          if (resultado && resultado.pendiente) {
            continue;
          }

          if (resultado) {
            return resultado;
          }

        } catch (error) {
          console.log("Esperando respuesta:", error.message);
        }
      }

      throw new Error(
        "El servidor no respondió a tiempo. Intenta nuevamente."
      );
    }


    // ==========================================
    // 10. VALIDAR DISPOSITIVO EXISTENTE
    // ==========================================

    async function validarDispositivo(usuario, dispositivo) {
      mostrar(
        "Sesión detectada.\n\n" +
        "Comprobando autorización del dispositivo..."
      );

      const idToken = await usuario.getIdToken(true);
      const solicitud = crypto.randomUUID();

      const datos = new URLSearchParams({
        action: "validar_dispositivo",
        idToken: idToken,
        idDispositivo: dispositivo.id,
        tokenDispositivo: dispositivo.token,
        solicitud: solicitud
      });

      await enviarSolicitud(datos);

      const resultado = await esperarResultado(
        "resultado_validacion_dispositivo",
        solicitud
      );

      if (!resultado || resultado.ok !== true) {
        mostrar(
          "No se pudo confirmar la autorización.\n\n" +
          (resultado?.mensaje ||
            "El servidor no pudo confirmar el dispositivo.") +
          "\n\nEl identificador y el token se conservan. Intenta nuevamente."
        );

        return;
      }

      if (resultado.autorizado !== true) {
        mostrar(
          "Acceso no autorizado.\n\n" +
          (resultado.mensaje ||
            "Este dispositivo no está autorizado.") +
          "\n\nContacta a coordinación."
        );

        return;
      }

      dispositivo.estado = "autorizado";

      localStorage.setItem(
        CLAVE_DISPOSITIVO,
        JSON.stringify(dispositivo)
      );

      mostrar(
        "¡Dispositivo validado correctamente!\n\n" +
        "Correo: " + resultado.correo + "\n" +
        "Nombre: " + resultado.nombre + "\n" +
        "Teléfono: " + identificarTipoTelefono() +
        "\n\nEste teléfono continúa autorizado."
      );
    }


    // ==========================================
    // 11. VINCULAR DISPOSITIVO NUEVO
    // ==========================================

    async function vincularDispositivo(usuario, dispositivo) {
      mostrar(
        "Acceso institucional verificado.\n\n" +
        "Solicitando autorización del dispositivo..."
      );

      const idToken = await usuario.getIdToken(true);
      const solicitud = crypto.randomUUID();

      const datos = new URLSearchParams({
        action: "vincular_dispositivo",
        idToken: idToken,
        idDispositivo: dispositivo.id,
        tokenDispositivo: dispositivo.token,
        solicitud: solicitud
      });

      await enviarSolicitud(datos);

      const resultado = await esperarResultado(
        "resultado_vinculacion",
        solicitud
      );

      if (
        !resultado ||
        resultado.ok !== true ||
        resultado.autorizado !== true
      ) {
        mostrar(
          "No fue posible autorizar este dispositivo.\n\n" +
          (resultado?.mensaje ||
            "El servidor no pudo confirmar la solicitud.") +
          "\n\nEl identificador y el token se conservan."
        );

        return;
      }

      dispositivo.estado = "autorizado";

      localStorage.setItem(
        CLAVE_DISPOSITIVO,
        JSON.stringify(dispositivo)
      );

      mostrar(
        "¡Dispositivo autorizado!\n\n" +
        "Correo: " + resultado.correo + "\n" +
        "Nombre: " + resultado.nombre + "\n" +
        "Teléfono: " + identificarTipoTelefono() +
        "\n\nLa vinculación se completó correctamente."
      );
    }


    // ==========================================
    // 12. PROCESAR USUARIO
    // ==========================================

    async function procesarUsuario(usuario) {
      if (procesando) return;

      procesando = true;
      formulario.style.display = "none";

      try {
        const dispositivo = obtenerDispositivo();

        if (dispositivo.estado === "pendiente") {
          await vincularDispositivo(usuario, dispositivo);
        } else {
          await validarDispositivo(usuario, dispositivo);
        }

      } catch (error) {
        console.error(error);

        mostrar(
          "No se pudo completar la comprobación.\n\n" +
          error.message +
          "\n\nLos datos locales del dispositivo se conservan."
        );

      } finally {
        procesando = false;
      }
    }


    // ==========================================
    // 13. ENVIAR ENLACE DE ACCESO
    // ==========================================

    botonEnviar.addEventListener("click", async () => {
      const correo = document
        .getElementById("correo")
        .value
        .trim()
        .toLowerCase();

      if (!correo || !correo.includes("@")) {
        mostrar("Escribe un correo electrónico válido.");
        return;
      }

      botonEnviar.disabled = true;
      mostrar("Enviando enlace de acceso...");

      try {
        await sendSignInLinkToEmail(auth, correo, {
          url: URL_PAGINA,
          handleCodeInApp: true
        });

        localStorage.setItem(CLAVE_CORREO, correo);

        mostrar(
          "Enlace enviado correctamente.\n\n" +
          "Correo: " + correo +
          "\n\nAbre el enlace recibido desde este mismo navegador."
        );

      } catch (error) {
        console.error(error);

        mostrar(
          "No se pudo enviar el enlace.\n\n" +
          error.message
        );

      } finally {
        botonEnviar.disabled = false;
      }
    });


    // ==========================================
    // 14. COMPLETAR AUTENTICACIÓN FIREBASE
    // ==========================================

    async function comprobarEnlace() {
      if (!isSignInWithEmailLink(auth, window.location.href)) {
        return;
      }

      let correo = localStorage.getItem(CLAVE_CORREO);

      if (!correo) {
        correo = window.prompt(
          "Confirma el correo al que recibiste el enlace:"
        );
      }

      if (!correo) {
        mostrar("No se indicó el correo para completar el acceso.");
        return;
      }

      try {
        mostrar("Verificando enlace de acceso...");

        await signInWithEmailLink(
          auth,
          correo,
          window.location.href
        );

        localStorage.removeItem(CLAVE_CORREO);

        window.history.replaceState(
          {},
          document.title,
          URL_PAGINA
        );

        mostrar("Acceso verificado. Comprobando dispositivo...");

      } catch (error) {
        console.error(error);

        mostrar(
          "No se pudo completar la autenticación.\n\n" +
          error.message
        );
      }
    }


    // ==========================================
    // 15. RECONOCER SESIÓN AUTOMÁTICAMENTE
    // ==========================================

    onAuthStateChanged(auth, usuario => {
      if (usuario) {
        procesarUsuario(usuario);
      } else {
        formulario.style.display = "block";

        if (!isSignInWithEmailLink(auth, window.location.href)) {
          mostrar("Inicia sesión con tu correo institucional.");
        }
      }
    });


    // ==========================================
    // 16. INICIAR SISTEMA
    // ==========================================

    comprobarEnlace();

  </script>

</body>
</html>
