
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <meta name="description" content="Sistema de asistencia docente del Colegio Universitario de Yahualica">
  <link rel="manifest" href="./manifest.json">
  <title>Checador docente CUY</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 22px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #171717;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 460px;
      padding: 28px;
      background: #242424;
      border: 1px solid #414141;
      border-radius: 17px;
    }

    h1 {
      font-size: 25px;
    }

    p {
      color: #c9c9c9;
      line-height: 1.5;
    }

    .estado {
      margin-top: 22px;
      padding: 18px;
      background: #333;
      border-radius: 10px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .detalle {
      margin-top: 20px;
      padding: 15px;
      background: #2d2d2d;
      border-radius: 10px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .oculto {
      display: none !important;
    }

    .boton {
      display: block;
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: 0;
      border-radius: 10px;
      background: #e5e5e5;
      color: #171717;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .boton:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .aviso {
      margin-top: 16px;
      padding: 12px;
      border: 1px solid #806b31;
      border-radius: 9px;
      background: #3a321f;
      color: #f3dfa2;
      font-size: 13px;
      line-height: 1.5;
    }

    .pie {
      margin-top: 22px;
      font-size: 12px;
      color: #999;
    }

    .etiqueta {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 6px;
      background: #806b31;
      color: #fff1bd;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: .4px;
    }
  </style>
</head>

<body>
  <main>
    <span id="etiquetaModo" class="etiqueta">MODO DE PRUEBA</span>

    <h1>Checador CUY</h1>

    <p>
      Sistema institucional de registro de asistencia docente.
    </p>

    <div id="estado" class="estado">
      Iniciando checador...
    </div>

    <button id="botonLlegada" class="boton oculto" disabled>
      Simular llegada
    </button>

    <div id="detalle" class="detalle oculto"></div>

    <div class="aviso">
      Durante esta etapa, las simulaciones se guardan únicamente
      en este teléfono. No se envían a los registros oficiales.
    </div>

    <p class="pie">
      Colegio Universitario de Yahualica · Control de asistencia
    </p>
  </main>

  <script type="module">

    /*************************************************
     * 1. CONFIGURACIÓN
     *************************************************/

    // IMPORTANTE:
    // true = simulaciones locales, sin enviar asistencias.
    // false = funcionamiento real, sujeto a validación.
    const MODO_PRUEBA = true;

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";


    const firebaseConfig = {
      apiKey: "AIzaSyAMLtZyqiUkME1HwiGSHOFFw7j-UpmBbJI",
      authDomain: "checador-docente-cuy.firebaseapp.com",
      projectId: "checador-docente-cuy",
      storageBucket: "checador-docente-cuy.firebasestorage.app",
      messagingSenderId: "15127097699",
      appId: "1:15127097699:web:308aae0b17e363ad5b2356",
      measurementId: "G-BP8YEFQDJE"
    };

    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyXlKZuyW8NkhM8Jwut84LDVXCQIsx-8Fa0wZ8Jkcdo57s3ZqAnD9Q0IOXgJvw9AKXY/exec";

    const URL_ACCESO = "./prueba_firebase.html";

    const CLAVE_DISPOSITIVO = "checador_dispositivo_v1";

    const DB_NOMBRE = "ChecadorCUY";
    const DB_VERSION = 1;

    const estado = document.getElementById("estado");
    const detalle = document.getElementById("detalle");
    const botonLlegada = document.getElementById("botonLlegada");
    const etiquetaModo = document.getElementById("etiquetaModo");

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let usuarioActual = null;
    let dispositivoActual = null;
    let baseDatos = null;
    let procesoEnCurso = false;


    /*************************************************
     * 2. INTERFAZ
     *************************************************/

    function mostrar(mensaje) {
      estado.textContent = mensaje;
    }

    function mostrarDetalle(mensaje) {
      detalle.textContent = mensaje;
      detalle.classList.remove("oculto");
    }

    function mostrarBoton(texto) {
      botonLlegada.textContent = texto;
      botonLlegada.disabled = false;
      botonLlegada.classList.remove("oculto");
    }

    function ocultarBoton() {
      botonLlegada.disabled = true;
      botonLlegada.classList.add("oculto");
    }

    if (MODO_PRUEBA) {
      etiquetaModo.textContent = "MODO DE PRUEBA";
    } else {
      etiquetaModo.textContent = "MODO DE ASISTENCIA";
      etiquetaModo.style.background = "#245c3a";
    }


    /*************************************************
     * 3. IDENTIFICACIÓN DEL TELÉFONO
     *************************************************/

    function obtenerTipoTelefono() {
      const agente = navigator.userAgent || "";

      if (/iPhone|iPad|iPod/i.test(agente)) {
        return "iPhone";
      }

      if (/Android/i.test(agente)) {
        return "Android";
      }

      return "Otro dispositivo";
    }

    function obtenerDispositivo() {
      try {
        const texto = localStorage.getItem(CLAVE_DISPOSITIVO);

        if (!texto) return null;

        const dispositivo = JSON.parse(texto);

        if (
          dispositivo.id &&
          dispositivo.token &&
          dispositivo.estado === "autorizado"
        ) {
          return dispositivo;
        }

      } catch (error) {
        console.error(error);
      }

      return null;
    }


    /*************************************************
     * 4. BASE DE DATOS LOCAL INDEXEDDB
     *************************************************/

    function abrirBaseDatos() {
      return new Promise((resolve, reject) => {
        const solicitud = indexedDB.open(
          DB_NOMBRE,
          DB_VERSION
        );

        solicitud.onupgradeneeded = event => {
          const db = event.target.result;

          if (!db.objectStoreNames.contains("pruebas")) {
            db.createObjectStore("pruebas", {
              keyPath: "idRegistro"
            });
          }

          if (!db.objectStoreNames.contains("pendientes")) {
            db.createObjectStore("pendientes", {
              keyPath: "idRegistro"
            });
          }
        };

        solicitud.onsuccess = () => {
          resolve(solicitud.result);
        };

        solicitud.onerror = () => {
          reject(solicitud.error);
        };
      });
    }

    function guardarLocal(nombreAlmacen, registro) {
      return new Promise((resolve, reject) => {
        const transaccion = baseDatos.transaction(
          nombreAlmacen,
          "readwrite"
        );

        transaccion.objectStore(nombreAlmacen).put(registro);

        transaccion.oncomplete = () => resolve(true);
        transaccion.onerror = () => reject(transaccion.error);
        transaccion.onabort = () => reject(transaccion.error);
      });
    }

    function obtenerTodos(nombreAlmacen) {
      return new Promise((resolve, reject) => {
        const transaccion = baseDatos.transaction(
          nombreAlmacen,
          "readonly"
        );

        const solicitud = transaccion
          .objectStore(nombreAlmacen)
          .getAll();

        solicitud.onsuccess = () => resolve(solicitud.result || []);
        solicitud.onerror = () => reject(solicitud.error);
      });
    }

    function obtenerLocal(nombreAlmacen, idRegistro) {
      return new Promise((resolve, reject) => {
        const transaccion = baseDatos.transaction(
          nombreAlmacen,
          "readonly"
        );

        const solicitud = transaccion
          .objectStore(nombreAlmacen)
          .get(idRegistro);

        solicitud.onsuccess = () => resolve(solicitud.result || null);
        solicitud.onerror = () => reject(solicitud.error);
      });
    }

    function eliminarLocal(nombreAlmacen, idRegistro) {
      return new Promise((resolve, reject) => {
        const transaccion = baseDatos.transaction(
          nombreAlmacen,
          "readwrite"
        );

        transaccion.objectStore(nombreAlmacen).delete(idRegistro);

        transaccion.oncomplete = () => resolve(true);
        transaccion.onerror = () => reject(transaccion.error);
      });
    }


    /*************************************************
     * 5. FECHA E IDENTIFICADOR
     *************************************************/

    function obtenerFechaMexico() {
      const partes = new Intl.DateTimeFormat("en-CA", {
        timeZone: "America/Mexico_City",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());

      const valores = {};

      partes.forEach(parte => {
        valores[parte.type] = parte.value;
      });

      return (
        valores.year +
        valores.month +
        valores.day
      );
    }

    function crearIdRegistro(dispositivo) {
      return dispositivo.id + obtenerFechaMexico();
    }

    function crearRegistro(usuario, dispositivo) {
      return {
        idRegistro: crearIdRegistro(dispositivo),
        correo: usuario.email,
        timestamp: Date.now(),
        tipoDispositivo: obtenerTipoTelefono(),
        sincronizado: false
      };
    }


    /*************************************************
     * 6. JSONP
     *************************************************/

    function generarUUID() {
      if (crypto.randomUUID) {
        return crypto.randomUUID();
      }

      return Array.from(
        crypto.getRandomValues(new Uint8Array(16))
      ).map(n => n.toString(16).padStart(2, "0")).join("");
    }

    function consultarServidor(accion, solicitud) {
      return new Promise((resolve, reject) => {
        const callback =
          "cuy_" + generarUUID().replace(/-/g, "");

        const script = document.createElement("script");
        let terminado = false;

        function limpiar() {
          clearTimeout(temporizador);
          delete window[callback];

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }

        const temporizador = setTimeout(() => {
          if (terminado) return;

          terminado = true;
          limpiar();

          reject(new Error("Tiempo de espera agotado."));
        }, 10000);

        window[callback] = resultado => {
          if (terminado) return;

          terminado = true;
          limpiar();

          resolve(resultado);
        };

        const parametros = new URLSearchParams({
          action: accion,
          id: solicitud,
          callback: callback
        });

        script.src = SCRIPT_URL + "?" + parametros.toString();

        script.onerror = () => {
          if (terminado) return;

          terminado = true;
          limpiar();

          reject(new Error("No se pudo consultar el servidor."));
        };

        document.body.appendChild(script);
      });
    }


    /*************************************************
     * 7. ENVÍO POST
     *************************************************/

    async function enviarSolicitud(datos) {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded;charset=UTF-8"
        },
        body: datos.toString()
      });
    }

    async function esperarResultado(accion, solicitud) {
      for (let intento = 0; intento < 15; intento++) {
        await new Promise(resolve => setTimeout(resolve, 1000));

        try {
          const resultado = await consultarServidor(
            accion,
            solicitud
          );

          if (resultado && resultado.pendiente) {
            continue;
          }

          if (resultado) {
            return resultado;
          }

        } catch (error) {
          console.log(error.message);
        }
      }

      throw new Error("El servidor no confirmó la operación.");
    }


    /*************************************************
     * 8. VALIDAR TELÉFONO CON EL SERVIDOR
     *************************************************/

    async function validarTelefono(usuario, dispositivo) {
      if (!navigator.onLine) {
        throw new Error("Se necesita conexión para validar el teléfono.");
      }

      const idToken = await usuario.getIdToken(true);
      const solicitud = generarUUID();

      const datos = new URLSearchParams({
        action: "validar_dispositivo",
        idToken: idToken,
        idDispositivo: dispositivo.id,
        tokenDispositivo: dispositivo.token,
        tipoDispositivo: obtenerTipoTelefono(),
        solicitud: solicitud
      });

      await enviarSolicitud(datos);

      const resultado = await esperarResultado(
        "resultado_validacion_dispositivo",
        solicitud
      );

      if (
        !resultado ||
        resultado.ok !== true ||
        resultado.autorizado !== true
      ) {
        throw new Error(
          resultado?.mensaje || "Teléfono no autorizado."
        );
      }

      return resultado;
    }


    /*************************************************
     * 9. SIMULACIÓN LOCAL
     *************************************************/

    async function simularLlegada() {
      if (procesoEnCurso) return;

      procesoEnCurso = true;
      botonLlegada.disabled = true;

      try {
        const registro = crearRegistro(
          usuarioActual,
          dispositivoActual
        );

        const existente = await obtenerLocal(
          "pruebas",
          registro.idRegistro
        );

        if (existente) {
          mostrar("Ya existe una simulación de llegada para hoy.");

          mostrarDetalle(
            "Correo: " + existente.correo +
            "\nFecha: " +
            new Date(existente.timestamp).toLocaleDateString("es-MX") +
            "\nHora: " +
            new Date(existente.timestamp).toLocaleTimeString("es-MX") +
            "\nEstado: Simulación local"
          );

          return;
        }

        registro.modo = "PRUEBA_LOCAL";
        registro.sincronizado = false;

        await guardarLocal("pruebas", registro);

        mostrar(
          "Simulación guardada correctamente.\n\n" +
          "Este registro permanece únicamente en este teléfono."
        );

        mostrarDetalle(
          "Correo: " + registro.correo +
          "\nFecha: " +
          new Date(registro.timestamp).toLocaleDateString("es-MX") +
          "\nHora: " +
          new Date(registro.timestamp).toLocaleTimeString("es-MX") +
          "\nDispositivo: " + registro.tipoDispositivo +
          "\nConexión: " +
          (navigator.onLine ? "Con internet" : "Sin internet") +
          "\nDestino: IndexedDB local" +
          "\nEstado: No enviado a Google Sheets"
        );

      } catch (error) {
        mostrar("No se pudo guardar la simulación.\n\n" + error.message);

      } finally {
        procesoEnCurso = false;
        botonLlegada.disabled = false;
      }
    }


    /*************************************************
     * 10. REGISTRO REAL
     *************************************************/

    async function sincronizarRegistro(usuario, dispositivo, registro) {
      if (!navigator.onLine) {
        throw new Error("No hay conexión para sincronizar.");
      }

      const idToken = await usuario.getIdToken(true);
      const solicitud = generarUUID();

      const datos = new URLSearchParams({
        action: "sync",
        solicitud: solicitud,
        idRegistro: registro.idRegistro,
        idToken: idToken,
        idDispositivo: dispositivo.id,
        tokenDispositivo: dispositivo.token,
        timestamp: String(registro.timestamp)
      });

      await enviarSolicitud(datos);

      const resultado = await esperarResultado(
        "resultado_sync",
        solicitud
      );

      if (!resultado || resultado.ok !== true) {
        throw new Error(
          resultado?.mensaje || "No se pudo registrar la asistencia."
        );
      }

      await eliminarLocal("pendientes", registro.idRegistro);

      return resultado;
    }


    async function registrarAsistenciaReal() {
      if (procesoEnCurso) return;

      procesoEnCurso = true;
      botonLlegada.disabled = true;

      try {
        const idRegistro = crearIdRegistro(dispositivoActual);

        const prueba = await obtenerLocal("pruebas", idRegistro);

        if (prueba) {
          mostrar(
            "Este teléfono ya tiene una simulación de llegada hoy. " +
            "No se generará una asistencia real automáticamente."
          );
          return;
        }

        const pendiente = await obtenerLocal(
          "pendientes",
          idRegistro
        );

        if (pendiente) {
          if (!navigator.onLine) {
            mostrar("Tu asistencia está guardada y pendiente de sincronización.");
            return;
          }

          await validarTelefono(usuarioActual, dispositivoActual);

          const resultado = await sincronizarRegistro(
            usuarioActual,
            dispositivoActual,
            pendiente
          );

          mostrar(
            resultado.duplicado
              ? "La asistencia ya estaba registrada en el servidor."
              : "Asistencia sincronizada correctamente."
          );

          return;
        }

        const registro = crearRegistro(
          usuarioActual,
          dispositivoActual
        );

        await guardarLocal("pendientes", registro);

        if (!navigator.onLine) {
          mostrar(
            "Asistencia guardada en este teléfono.\n\n" +
            "Se sincronizará cuando vuelva la conexión."
          );
          return;
        }

        await validarTelefono(usuarioActual, dispositivoActual);

        const resultado = await sincronizarRegistro(
          usuarioActual,
          dispositivoActual,
          registro
        );

        mostrar(
          resultado.duplicado
            ? "Tu asistencia ya estaba registrada para hoy."
            : "¡Asistencia registrada correctamente!"
        );

        mostrarDetalle(
          "Correo: " + registro.correo +
          "\nFecha: " +
          new Date(registro.timestamp).toLocaleDateString("es-MX") +
          "\nHora: " +
          new Date(registro.timestamp).toLocaleTimeString("es-MX") +
          "\nEstado: Confirmado por el servidor"
        );

      } catch (error) {
        mostrar(
          "La asistencia quedó pendiente o no pudo confirmarse.\n\n" +
          error.message
        );

      } finally {
        procesoEnCurso = false;
        botonLlegada.disabled = false;
      }
    }


    /*************************************************
     * 11. SINCRONIZAR PENDIENTES REALES
     *************************************************/

    async function sincronizarPendientes() {
      if (
        MODO_PRUEBA ||
        !navigator.onLine ||
        !usuarioActual ||
        !dispositivoActual ||
        procesoEnCurso
      ) {
        return;
      }

      const pendientes = await obtenerTodos("pendientes");

      if (!pendientes.length) return;

      procesoEnCurso = true;

      try {
        await validarTelefono(usuarioActual, dispositivoActual);

        for (const registro of pendientes) {
          mostrar("Sincronizando asistencia pendiente...");

          await sincronizarRegistro(
            usuarioActual,
            dispositivoActual,
            registro
          );
        }

        mostrar(
          "Las asistencias pendientes se sincronizaron correctamente."
        );

      } catch (error) {
        mostrar(
          "No se pudo completar la sincronización.\n\n" +
          error.message
        );

      } finally {
        procesoEnCurso = false;
      }
    }


    /*************************************************
     * 12. INICIO DE LA APLICACIÓN
     *************************************************/

    async function iniciarAplicacion(usuario) {
      usuarioActual = usuario;

      ocultarBoton();

      if (!usuario) {
        mostrar("No hay una sesión activa. Redirigiendo al acceso...");

        setTimeout(() => {
          window.location.href = URL_ACCESO;
        }, 1800);

        return;
      }

      if (!usuario.email) {
        mostrar("La cuenta no tiene un correo disponible.");
        return;
      }

      try {
        baseDatos = await abrirBaseDatos();

        dispositivoActual = obtenerDispositivo();

        if (!dispositivoActual) {
          mostrar(
            "Este teléfono no tiene una autorización local.\n\n" +
            "Inicia sesión y vincula primero el dispositivo."
          );

          setTimeout(() => {
            window.location.href = URL_ACCESO;
          }, 2500);

          return;
        }

        if (MODO_PRUEBA) {
          mostrar(
            "Sesión reconocida.\n\n" +
            "Correo: " + usuario.email +
            "\nDispositivo: " + obtenerTipoTelefono() +
            "\nConexión: " +
            (navigator.onLine ? "Disponible" : "Sin conexión") +
            "\n\nPuedes realizar una simulación local."
          );

          mostrarBoton("Simular llegada");

          const registros = await obtenerTodos("pruebas");

          const idHoy = crearIdRegistro(dispositivoActual);

          const registroHoy = registros.find(
            item => item.idRegistro === idHoy
          );

          if (registroHoy) {
            mostrar("Ya existe una simulación guardada para hoy.");

            mostrarDetalle(
              "Correo: " + registroHoy.correo +
              "\nHora: " +
              new Date(registroHoy.timestamp).toLocaleTimeString("es-MX") +
              "\nEstado: Simulación local"
            );
          }

          return;
        }

        mostrar(
          "Sesión reconocida.\n\n" +
          "Pulsa el botón para registrar tu llegada."
        );

        mostrarBoton("Registrar mi llegada");

        await sincronizarPendientes();

      } catch (error) {
        console.error(error);
        mostrar("Error al iniciar la aplicación: " + error.message);
      }
    }


    /*************************************************
     * 13. EVENTOS
     *************************************************/

    botonLlegada.addEventListener("click", async () => {
      if (!usuarioActual || !dispositivoActual) return;

      if (MODO_PRUEBA) {
        await simularLlegada();
      } else {
        await registrarAsistenciaReal();
      }
    });


    window.addEventListener("online", async () => {
      if (MODO_PRUEBA) {
        mostrar(
          "Conexión recuperada.\n\n" +
          "Las simulaciones siguen siendo locales y no se enviarán."
        );
        return;
      }

      await sincronizarPendientes();
    });


    window.addEventListener("offline", () => {
      mostrar(
        "No hay conexión a internet.\n\n" +
        "Las nuevas asistencias reales podrán guardarse localmente " +
        "si el dispositivo ya fue autorizado."
      );
    });


    /*************************************************
     * 14. FIREBASE AUTH
     *************************************************/

    onAuthStateChanged(auth, usuario => {
      iniciarAplicacion(usuario);
    });


    /*************************************************
     * 15. SERVICE WORKER
     *************************************************/

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js")
        .catch(error => {
          console.error("Error Service Worker:", error);
        });
    }

  </script>
