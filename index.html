
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <meta name="description" content="Sistema de asistencia docente del Colegio Universitario de Yahualica">
  <link rel="manifest" href="./manifest.json">
  <title>Checador docente CUY</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 22px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #171717;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 460px;
      padding: 28px;
      background: #242424;
      border: 1px solid #414141;
      border-radius: 17px;
    }

    h1 { font-size: 25px; }

    p {
      color: #c9c9c9;
      line-height: 1.5;
    }

    .estado {
      margin-top: 22px;
      padding: 18px;
      background: #333;
      border-radius: 10px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .detalle {
      margin-top: 20px;
      padding: 15px;
      background: #2d2d2d;
      border-radius: 10px;
      line-height: 1.7;
    }

    .pequeno {
      margin-top: 22px;
      font-size: 12px;
      color: #999;
    }

    .oculto { display: none; }
  </style>
</head>

<body>
  <main>
    <h1>Checador CUY</h1>

    <p>
      Sistema institucional de registro de asistencia docente.
    </p>

    <div id="estado" class="estado">
      Iniciando checador...
    </div>

    <div id="detalle" class="detalle oculto"></div>

    <p class="pequeno">
      Colegio Universitario de Yahualica · Control de asistencia
    </p>
  </main>

  <script>
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyXlKZuyW8NkhM8Jwut84LDVXCQIsx-8Fa0wZ8Jkcdo57s3ZqAnD9Q0IOXgJvw9AKXY/exec";

    const URL_ACCESO = "./prueba_firebase.html";

    const CLAVE_DISPOSITIVO = "checador_dispositivo_v1";
    const CLAVE_REGISTROS = "checador_registros_v2";

    const estado = document.getElementById("estado");
    const detalle = document.getElementById("detalle");

    let usuarioFirebase = null;
    let procesando = false;

    function mostrar(mensaje) {
      estado.textContent = mensaje;
    }

    function mostrarDetalle(mensaje) {
      detalle.textContent = mensaje;
      detalle.classList.remove("oculto");
    }

    function generarUUID() {
      if (crypto.randomUUID) return crypto.randomUUID();

      return Array.from(crypto.getRandomValues(new Uint8Array(16)))
        .map(n => n.toString(16).padStart(2, "0"))
        .join("");
    }

    function obtenerDispositivo() {
      const texto = localStorage.getItem(CLAVE_DISPOSITIVO);

      if (!texto) return null;

      try {
        const dispositivo = JSON.parse(texto);

        if (dispositivo.id && dispositivo.token) {
          return dispositivo;
        }
      } catch (error) {
        console.error(error);
      }

      return null;
    }

    function obtenerTipoTelefono() {
      const agente = navigator.userAgent || "";

      if (/iPhone|iPad|iPod/i.test(agente)) return "iPhone";
      if (/Android/i.test(agente)) return "Android";

      return "Otro dispositivo";
    }

    function obtenerRegistros() {
      try {
        return JSON.parse(
          localStorage.getItem(CLAVE_REGISTROS) || "[]"
        );
      } catch (error) {
        return [];
      }
    }

    function guardarRegistros(registros) {
      localStorage.setItem(
        CLAVE_REGISTROS,
        JSON.stringify(registros)
      );
    }

    function obtenerFechaLocal() {
      const partes = new Intl.DateTimeFormat("en-CA", {
        timeZone: "America/Mexico_City",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());

      const valores = {};
      partes.forEach(p => valores[p.type] = p.value);

      return valores.year + valores.month + valores.day;
    }

    function crearIdDiario(dispositivo) {
      // Un identificador estable por teléfono y día.
      return dispositivo.id + obtenerFechaLocal();
    }

    function consultarServidor(accion, id) {
      return new Promise((resolve, reject) => {
        const callback = "cuy_" + generarUUID().replace(/-/g, "");
        const script = document.createElement("script");
        let terminado = false;

        function limpiar() {
          clearTimeout(temporizador);
          delete window[callback];
          script.remove();
        }

        const temporizador = setTimeout(() => {
          if (terminado) return;
          terminado = true;
          limpiar();
          reject(new Error("El servidor tardó demasiado."));
        }, 10000);

        window[callback] = resultado => {
          if (terminado) return;
          terminado = true;
          limpiar();
          resolve(resultado);
        };

        const parametros = new URLSearchParams({
          action: accion,
          id: id,
          callback: callback
        });

        script.src = SCRIPT_URL + "?" + parametros.toString();

        script.onerror = () => {
          if (terminado) return;
          terminado = true;
          limpiar();
          reject(new Error("No se pudo consultar el servidor."));
        };

        document.body.appendChild(script);
      });
    }

    async function enviarPost(datos) {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded;charset=UTF-8"
        },
        body: datos.toString()
      });
    }

    async function validarTelefono(usuario, dispositivo) {
      mostrar("Comprobando autorización del teléfono...");

      const idToken = await usuario.getIdToken(true);
      const solicitud = generarUUID();

      const datos = new URLSearchParams({
        action: "validar_dispositivo",
        idToken: idToken,
        idDispositivo: dispositivo.id,
        tokenDispositivo: dispositivo.token,
        tipoDispositivo: obtenerTipoTelefono(),
        solicitud: solicitud
      });

      await enviarPost(datos);

      for (let i = 0; i < 15; i++) {
        await new Promise(resolve => setTimeout(resolve, 1000));

        try {
          const resultado = await consultarServidor(
            "resultado_validacion_dispositivo",
            solicitud
          );

          if (resultado && resultado.pendiente) continue;

          if (
            resultado &&
            resultado.ok === true &&
            resultado.autorizado === true
          ) {
            return resultado;
          }

          throw new Error(
            resultado?.mensaje || "Teléfono no autorizado."
          );

        } catch (error) {
          if (
            error.message !== "El servidor tardó demasiado." &&
            error.message !== "No se pudo consultar el servidor."
          ) {
            throw error;
          }
        }
      }

      throw new Error("No se pudo confirmar la autorización.");
    }

    async function comprobarRegistroExistente(idRegistro) {
      for (let i = 0; i < 12; i++) {
        await new Promise(resolve => setTimeout(resolve, 1500));

        try {
          const resultado = await consultarServidor(
            "status",
            idRegistro
          );

          if (resultado && resultado.encontrado === true) {
            return true;
          }
        } catch (error) {
          console.log(error.message);
        }
      }

      return false;
    }

    async function registrarLlegada(usuario, dispositivo) {
      const idRegistro = crearIdDiario(dispositivo);
      const registros = obtenerRegistros();

      const existente = registros.find(
        r => r.idRegistro === idRegistro
      );

      if (existente && existente.sincronizado) {
        mostrar("Tu asistencia de hoy ya está registrada.");
        mostrarDetalle(
          "Fecha: " + new Date(
            existente.timestamp
          ).toLocaleDateString("es-MX") +
          "\nHora: " + new Date(
            existente.timestamp
          ).toLocaleTimeString("es-MX")
        );
        return;
      }

      if (!navigator.onLine) {
        mostrar(
          "No hay conexión a internet.\n\n" +
          "Tu teléfono está autorizado, pero todavía no podemos " +
          "confirmar el registro con el servidor."
        );
        return;
      }

      mostrar("Registrando tu llegada...");

      const timestamp = existente
        ? existente.timestamp
        : new Date().toISOString();

      const idToken = await usuario.getIdToken(true);

      const registro = {
        idRegistro: idRegistro,
        timestamp: timestamp,
        sincronizado: false
      };

      const lista = obtenerRegistros();

      if (!lista.some(r => r.idRegistro === idRegistro)) {
        lista.push(registro);
        guardarRegistros(lista);
      }

      const datos = new URLSearchParams({
        action: "sync",
        idRegistro: idRegistro,
        idToken: idToken,
        idDispositivo: dispositivo.id,
        tokenDispositivo: dispositivo.token,
        timestamp: String(new Date(timestamp).getTime())
      });

      await enviarPost(datos);

      const confirmado = await comprobarRegistroExistente(
        idRegistro
      );

      if (!confirmado) {
        mostrar(
          "La solicitud fue enviada, pero todavía no se confirmó " +
          "en el servidor.\n\nNo vuelvas a escanear repetidamente. " +
          "Conservamos el identificador para evitar duplicados."
        );
        return;
      }

      const actualizados = obtenerRegistros().map(r => {
        if (r.idRegistro === idRegistro) {
          return {
            ...r,
            sincronizado: true
          };
        }
        return r;
      });

      guardarRegistros(actualizados);

      mostrar("¡Asistencia registrada correctamente!");

      mostrarDetalle(
        "Docente: " + usuario.email +
        "\nFecha: " + new Date(timestamp).toLocaleDateString("es-MX") +
        "\nHora de llegada: " +
        new Date(timestamp).toLocaleTimeString("es-MX") +
        "\nTeléfono: " + obtenerTipoTelefono() +
        "\nEstado: Registrado en el servidor"
      );
    }

    async function iniciar() {
      if (procesando) return;
      procesando = true;

      try {
        const dispositivo = obtenerDispositivo();

        if (!dispositivo || dispositivo.estado !== "autorizado") {
          mostrar("Este teléfono todavía no está autorizado.");
          setTimeout(() => {
            window.location.href = URL_ACCESO;
          }, 1800);
          return;
        }

        if (!navigator.onLine) {
          mostrar(
            "Sin conexión a internet.\n\n" +
            "Conecta tu teléfono para validar tu sesión y registrar " +
            "la asistencia."
          );
          return;
        }

        mostrar("Comprobando sesión institucional...");

        const { initializeApp } = await import(
          "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js"
        );

        const {
          getAuth,
          onAuthStateChanged
        } = await import(
          "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js"
        );

        const firebaseConfig = {
          apiKey: "AIzaSyAMLtZyqiUkME1HwiGSHOFFw7j-UpmBbJI",
          authDomain: "checador-docente-cuy.firebaseapp.com",
          projectId: "checador-docente-cuy",
          storageBucket: "checador-docente-cuy.firebasestorage.app",
          messagingSenderId: "15127097699",
          appId: "1:15127097699:web:308aae0b17e363ad5b2356",
          measurementId: "G-BP8YEFQDJE"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, async usuario => {
          if (!usuario) {
            mostrar("No hay una sesión institucional activa.");
            setTimeout(() => {
              window.location.href = URL_ACCESO;
            }, 1800);
            return;
          }

          usuarioFirebase = usuario;

          try {
            const validacion = await validarTelefono(
              usuario,
              dispositivo
            );

            await registrarLlegada(usuario, dispositivo);

          } catch (error) {
            console.error(error);
            mostrar(
              "No se pudo completar el registro.\n\n" +
              error.message
            );
          }
        });

      } catch (error) {
        console.error(error);
        mostrar(
          "No se pudo iniciar el checador.\n\n" +
          error.message
        );
      } finally {
        procesando = false;
      }
    }

    window.addEventListener("online", () => {
      window.location.reload();
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js")
        .catch(error => console.log("Service Worker:", error));
    }

    iniciar();
  </script>
</body>
</html>
