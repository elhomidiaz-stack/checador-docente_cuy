
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#176b45">
<link rel="manifest" href="./manifest.json">
<title>Control de asistencia CUY</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #edf1f5;
  font-family: Arial, sans-serif;
}

.card {
  width: 100%;
  max-width: 390px;
  background: white;
  border-radius: 18px;
  padding: 30px 24px;
  text-align: center;
  box-shadow: 0 5px 25px #00000015;
}

.icon { font-size: 48px; }
h1 { color: #202c35; font-size: 24px; }

p {
  color: #777;
  font-size: 14px;
  line-height: 1.5;
}

input, button {
  width: 100%;
  padding: 15px;
  border-radius: 9px;
  font-size: 16px;
  margin-top: 12px;
}

input { border: 1px solid #ccc; }

button {
  border: none;
  background: #176b45;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:disabled { opacity: .5; }

.secundario {
  background: white;
  border: 1px solid #176b45;
  color: #176b45;
}

#mensaje {
  margin-top: 20px;
  padding: 15px;
  border-radius: 10px;
  white-space: pre-line;
  font-size: 14px;
  display: none;
}

.exito {
  display: block !important;
  background: #e2f5e9;
  color: #176b45;
}

.pendiente {
  display: block !important;
  background: #fff1d5;
  color: #875900;
}

.error {
  display: block !important;
  background: #ffe5e5;
  color: #a02020;
}

.pie {
  margin-top: 25px;
  font-size: 11px;
  color: #999;
}
</style>
</head>

<body>
<div class="card">
  <div class="icon">📲</div>
  <h1>Control de asistencia</h1>
  <p>Colegio Universitario de Yahualica</p>

  <div id="formulario">
    <p>Ingresa tu correo la primera vez.</p>
    <input type="email" id="correo"
      placeholder="correo@ejemplo.com"
      autocomplete="email">
    <button onclick="guardarCorreo()">
      Guardar correo y registrar
    </button>
  </div>

  <div id="mensaje" role="status"
       aria-live="polite"></div>

  <button class="secundario"
    onclick="sincronizar()">
    Sincronizar pendientes
  </button>

  <button class="secundario"
    onclick="cambiarCorreo()">
    Cambiar correo
  </button>

  <div class="pie" id="estado">
    Sistema de asistencia NFC
  </div>
</div>

<script>
// PEGA AQUÍ LA URL /exec DE TU APPS SCRIPT.
const SCRIPT_URL = 'PEGA_AQUI_TU_URL_EXEC';

const CLAVE_CORREO = 'cuy_correo';
const CLAVE_PENDIENTES = 'cuy_pendientes';
const CLAVE_HISTORIAL = 'cuy_historial';

let sincronizando = false;

function leer(clave, defecto) {
  try {
    return JSON.parse(localStorage.getItem(clave))
      ?? defecto;
  } catch {
    return defecto;
  }
}

function guardar(clave, valor) {
  localStorage.setItem(clave, JSON.stringify(valor));
}

function mostrar(texto, tipo) {
  const el = document.getElementById('mensaje');
  el.textContent = texto;
  el.className = tipo;
}

function fechaLocal(iso) {
  return new Intl.DateTimeFormat('en-CA', {
    timeZone: 'America/Mexico_City',
    year: 'numeric',
    month: '2-digit',
    day: '2-digit'
  }).format(new Date(iso));
}

function dispositivo() {
  const ua = navigator.userAgent;
  if (/Android/i.test(ua)) return 'Android';
  if (/iPhone|iPad/i.test(ua)) return 'iPhone';
  if (/Windows/i.test(ua)) return 'Windows';
  return 'Otro';
}

function guardarCorreo() {
  const correo = document.getElementById('correo')
    .value.trim().toLowerCase();

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) {
    mostrar('Ingresa un correo válido.', 'error');
    return;
  }

  try {
    localStorage.setItem(CLAVE_CORREO, correo);
  } catch {
    mostrar('No se pudo guardar el correo.', 'error');
    return;
  }

  document.getElementById('formulario')
    .style.display = 'none';

  crearRegistro(correo);
}

function crearRegistro(correo) {
  const instante = new Date().toISOString();
  const dia = fechaLocal(instante);

  const pendientes = leer(CLAVE_PENDIENTES, []);
  const historial = leer(CLAVE_HISTORIAL, []);

  const existe = [...pendientes, ...historial]
    .some(r => r.correo === correo &&
      fechaLocal(r.instante) === dia);

  if (existe) {
    mostrar(
      'Tu asistencia de hoy ya fue registrada o está pendiente.',
      'pendiente'
    );
    sincronizar();
    return;
  }

  const registro = {
    id: crypto.randomUUID(),
    correo,
    instante,
    dispositivo: dispositivo()
  };

  try {
    pendientes.push(registro);
    guardar(CLAVE_PENDIENTES, pendientes);
  } catch {
    mostrar(
      'No se pudo guardar el registro en el teléfono.',
      'error'
    );
    return;
  }

  mostrar(
    'Asistencia guardada.\nHora del escaneo: ' +
    new Date(instante).toLocaleTimeString('es-MX') +
    '\nSe enviará cuando haya conexión.',
    'pendiente'
  );

  sincronizar();
}

function enviarRegistro(registro) {
  return new Promise((resolve, reject) => {
    const callback = 'cuyRespuesta_' +
      Math.random().toString(36).slice(2);

    const script = document.createElement('script');
    let terminado = false;

    const limpiar = () => {
      delete window[callback];
      script.remove();
      clearTimeout(timeout);
    };

    window[callback] = respuesta => {
      if (terminado) return;
      terminado = true;
      limpiar();
      resolve(respuesta);
    };

    const parametros = new URLSearchParams({
      accion: 'registrar',
      callback,
      id: registro.id,
      correo: registro.correo,
      instante: registro.instante,
      dispositivo: registro.dispositivo,
      _: String(Date.now())
    });

    script.src = SCRIPT_URL + '?' + parametros;

    script.onerror = () => {
      if (terminado) return;
      terminado = true;
      limpiar();
      reject(new Error('Sin conexión'));
    };

    const timeout = setTimeout(() => {
      if (terminado) return;
      terminado = true;
      limpiar();
      reject(new Error('Tiempo agotado'));
    }, 20000);

    document.head.appendChild(script);
  });
}

async function sincronizar() {
  if (sincronizando || !navigator.onLine) return;

  if (!SCRIPT_URL.startsWith('https://')) {
    mostrar('Configura la URL de Apps Script.', 'error');
    return;
  }

  sincronizando = true;

  try {
    const lista = leer(CLAVE_PENDIENTES, []);

    for (const registro of lista) {
      let respuesta;

      try {
        respuesta = await enviarRegistro(registro);
      } catch {
        break;
      }

      if (
        respuesta.estado === 'exito' ||
        respuesta.estado === 'duplicado'
      ) {
        // Guardar primero el acuse local.
        const historial = leer(CLAVE_HISTORIAL, []);
        if (!historial.some(r => r.id === registro.id)) {
          historial.push(registro);
          guardar(CLAVE_HISTORIAL, historial);
        }

        const restantes = leer(CLAVE_PENDIENTES, [])
          .filter(r => r.id !== registro.id);

        guardar(CLAVE_PENDIENTES, restantes);

        mostrar(
          respuesta.estado === 'exito'
            ? '¡ASISTENCIA REGISTRADA!\nFecha: ' +
              respuesta.fecha + '\nHora: ' + respuesta.hora
            : 'Tu asistencia ya estaba registrada.',
          'exito'
        );
      } else {
        mostrar(
          respuesta.mensaje || 'Error del servidor',
          'error'
        );
        break;
      }
    }

  } finally {
    sincronizando = false;
    actualizarEstado();
  }
}

function actualizarEstado() {
  const total = leer(CLAVE_PENDIENTES, []).length;

  document.getElementById('estado').textContent =
    total
      ? total + ' registro(s) pendiente(s)'
      : 'Todos los registros sincronizados';
}

function cambiarCorreo() {
  if (!confirm(
    '¿Cambiar el correo de este dispositivo?'
  )) return;

  localStorage.removeItem(CLAVE_CORREO);
  document.getElementById('formulario')
    .style.display = 'block';

  document.getElementById('correo').value = '';
  mostrar('Ingresa el nuevo correo.', 'pendiente');
}

window.addEventListener('online', sincronizar);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) sincronizar();
});

window.addEventListener('load', () => {
  actualizarEstado();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js')
      .catch(console.error);
  }

  const correo = localStorage.getItem(CLAVE_CORREO);

  if (correo) {
    document.getElementById('formulario')
      .style.display = 'none';
    crearRegistro(correo);
  } else {
    sincronizar();
  }
});
</script>
</body>
</html>
