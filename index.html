
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <meta name="description" content="Sistema de asistencia docente del Colegio Universitario de Yahualica">
  <link rel="manifest" href="./manifest.json">
  <title>Checador docente CUY</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 22px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #171717;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 460px;
      padding: 28px;
      background: #242424;
      border: 1px solid #414141;
      border-radius: 17px;
    }

    h1 { font-size: 25px; }

    p {
      color: #c9c9c9;
      line-height: 1.5;
    }

    .estado {
      margin-top: 22px;
      padding: 18px;
      background: #333;
      border-radius: 10px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .detalle {
      margin-top: 20px;
      padding: 15px;
      background: #2d2d2d;
      border-radius: 10px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .oculto { display: none; }

    .pie {
      margin-top: 22px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>
  <main>
    <h1>Checador CUY</h1>

    <p>
      Sistema institucional de registro de asistencia docente.
    </p>

    <div id="estado" class="estado">
      Iniciando checador...
    </div>

    <div id="detalle" class="detalle oculto"></div>

    <p class="pie">
      Colegio Universitario de Yahualica · Control de asistencia
    </p>
  </main>

  <script type="module">

    // ==========================================
    // 1. FIREBASE
    // ==========================================

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from
      "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";


    const firebaseConfig = {
      apiKey: "AIzaSyAMLtZyqiUkME1HwiGSHOFFw7j-UpmBbJI",
      authDomain: "checador-docente-cuy.firebaseapp.com",
      projectId: "checador-docente-cuy",
      storageBucket: "checador-docente-cuy.firebasestorage.app",
      messagingSenderId: "15127097699",
      appId: "1:15127097699:web:308aae0b17e363ad5b2356",
      measurementId: "G-BP8YEFQDJE"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    // ==========================================
    // 2. CONFIGURACIÓN
    // ==========================================

    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyXlKZuyW8NkhM8Jwut84LDVXCQIsx-8Fa0wZ8Jkcdo57s3ZqAnD9Q0IOXgJvw9AKXY/exec";

    const URL_ACCESO = "./prueba_firebase.html";

    const CLAVE_DISPOSITIVO = "checador_dispositivo_v1";
    const CLAVE_REGISTROS = "checador_registros_v2";

    const estado = document.getElementById("estado");
    const detalle = document.getElementById("detalle");

    let usuarioActual = null;
    let procesoEnCurso = false;


    // ==========================================
    // 3. FUNCIONES GENERALES
    // ==========================================

    function mostrar(mensaje) {
      estado.textContent = mensaje;
    }

    function mostrarDetalle(mensaje) {
      detalle.textContent = mensaje;
      detalle.classList.remove("oculto");
    }

    function generarUUID() {
      if (crypto.randomUUID) {
        return crypto.randomUUID();
      }

      return Array.from(
        crypto.getRandomValues(new Uint8Array(16))
      ).map(n => n.toString(16).padStart(2, "0")).join("");
    }

    function obtenerTipoTelefono() {
      const agente = navigator.userAgent || "";

      if (/iPhone|iPad|iPod/i.test(agente)) return "iPhone";
      if (/Android/i.test(agente)) return "Android";

      return "Otro dispositivo";
    }

    function obtenerDispositivo() {
      try {
        const texto = localStorage.getItem(CLAVE_DISPOSITIVO);

        if (!texto) return null;

        const dispositivo = JSON.parse(texto);

        if (
          dispositivo.id &&
          dispositivo.token &&
          dispositivo.estado === "autorizado"
        ) {
          return dispositivo;
        }

      } catch (error) {
        console.error("Error leyendo dispositivo:", error);
      }

      return null;
    }


    // ==========================================
    // 4. ALMACENAMIENTO LOCAL
    // ==========================================

    function obtenerRegistros() {
      try {
        return JSON.parse(
          localStorage.getItem(CLAVE_REGISTROS) || "[]"
        );
      } catch (error) {
        return [];
      }
    }

    function guardarRegistros(registros) {
      localStorage.setItem(
        CLAVE_REGISTROS,
        JSON.stringify(registros)
      );
    }

    function obtenerFechaMexico() {
      const partes = new Intl.DateTimeFormat("en-CA", {
        timeZone: "America/Mexico_City",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());

      const valores = {};

      partes.forEach(parte => {
        valores[parte.type] = parte.value;
      });

      return (
        valores.year +
        valores.month +
        valores.day
      );
    }

    function crearIdRegistro(dispositivo) {
      return dispositivo.id + obtenerFechaMexico();
    }

    function buscarRegistro(idRegistro) {
      return obtenerRegistros().find(
        registro => registro.idRegistro === idRegistro
      );
    }

    function guardarRegistroLocal(registro) {
      const registros = obtenerRegistros();

      const existente = registros.findIndex(
        item => item.idRegistro === registro.idRegistro
      );

      if (existente >= 0) {
        registros[existente] = {
          ...registros[existente],
          ...registro
        };
      } else {
        registros.push(registro);
      }

      guardarRegistros(registros);
    }


    // ==========================================
    // 5. CONSULTAS JSONP AL SERVIDOR
    // ==========================================

    function consultarServidor(accion, solicitud) {
      return new Promise((resolve, reject) => {

        const callback =
          "cuy_" + generarUUID().replace(/-/g, "");

        const script = document.createElement("script");
        let terminado = false;

        function limpiar() {
          clearTimeout(temporizador);
          delete window[callback];

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }

        const temporizador = setTimeout(() => {
          if (terminado) return;

          terminado = true;
          limpiar();

          reject(new Error("Tiempo de espera agotado."));
        }, 10000);

        window[callback] = resultado => {
          if (terminado) return;

          terminado = true;
          limpiar();

          resolve(resultado);
        };

        const parametros = new URLSearchParams({
          action: accion,
          id: solicitud,
          callback: callback
        });

        script.src = SCRIPT_URL + "?" + parametros.toString();

        script.onerror = () => {
          if (terminado) return;

          terminado = true;
          limpiar();

          reject(new Error("No se pudo consultar el servidor."));
        };

        document.body.appendChild(script);
      });
    }


    // ==========================================
    // 6. ENVÍO POST
    // ==========================================

    async function enviarSolicitud(datos) {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded;charset=UTF-8"
        },
        body: datos.toString()
      });
    }


    // ==========================================
    // 7. ESPERAR RESULTADO DEL SERVIDOR
    // ==========================================

    async function esperarResultado(accion, solicitud) {
      for (let intento = 0; intento < 15; intento++) {

        await new Promise(resolve => setTimeout(resolve, 1000));

        try {
          const resultado = await consultarServidor(
            accion,
            solicitud
          );

          if (resultado && resultado.pendiente) {
            continue;
          }

          if (resultado) {
            return resultado;
          }

        } catch (error) {
          console.log("Esperando servidor:", error.message);
        }
      }

      throw new Error(
        "El servidor no confirmó la operación."
      );
    }


    // ==========================================
    // 8. VALIDAR TELÉFONO
    // ==========================================

    async function validarTelefono(usuario, dispositivo) {
      mostrar("Comprobando autorización del teléfono...");

      const idToken = await usuario.getIdToken(true);
      const solicitud = generarUUID();

      const datos = new URLSearchParams({
        action: "validar_dispositivo",
        idToken: idToken,
        idDispositivo: dispositivo.id,
        tokenDispositivo: dispositivo.token,
        tipoDispositivo: obtenerTipoTelefono(),
        solicitud: solicitud
      });

      await enviarSolicitud(datos);

      const resultado = await esperarResultado(
        "resultado_validacion_dispositivo",
        solicitud
      );

      if (
        !resultado ||
        resultado.ok !== true ||
        resultado.autorizado !== true
      ) {
        throw new Error(
          resultado?.mensaje ||
          "El teléfono no está autorizado."
        );
      }

      return resultado;
    }


    // ==========================================
    // 9. CREAR O RECUPERAR ASISTENCIA
    // ==========================================

    function prepararRegistro(dispositivo, correo) {
      const idRegistro = crearIdRegistro(dispositivo);

      let registro = buscarRegistro(idRegistro);

      if (registro) {
        return registro;
      }

      registro = {
        idRegistro: idRegistro,
        correo: correo,
        timestamp: new Date().getTime(),
        sincronizado: false,
        creadoLocalmente: true
      };

      guardarRegistroLocal(registro);

      return registro;
    }


    // ==========================================
    // 10. SINCRONIZAR UNA ASISTENCIA
    // ==========================================

    async function sincronizarRegistro(
      usuario,
      dispositivo,
      registro
    ) {
      const idToken = await usuario.getIdToken(true);
      const solicitud = generarUUID();

      const datos = new URLSearchParams({
        action: "sync",
        solicitud: solicitud,
        idRegistro: registro.idRegistro,
        idToken: idToken,
        idDispositivo: dispositivo.id,
        tokenDispositivo: dispositivo.token,
        timestamp: String(registro.timestamp)
      });

      await enviarSolicitud(datos);

      const resultado = await esperarResultado(
        "resultado_sync",
        solicitud
      );

      if (!resultado || resultado.ok !== true) {
        throw new Error(
          resultado?.mensaje ||
          "El servidor rechazó el registro."
        );
      }

      registro.sincronizado = true;
      registro.horaRecepcion = new Date().toISOString();

      guardarRegistroLocal(registro);

      return resultado;
    }


    // ==========================================
    // 11. SINCRONIZAR REGISTROS PENDIENTES
    // ==========================================

    async function sincronizarPendientes(usuario, dispositivo) {
      if (!navigator.onLine) return;

      const pendientes = obtenerRegistros().filter(
        registro => registro.sincronizado !== true
      );

      for (const registro of pendientes) {
        mostrar(
          "Sincronizando asistencia pendiente...\n\n" +
          "No cierres esta página."
        );

        try {
          await sincronizarRegistro(
            usuario,
            dispositivo,
            registro
          );

        } catch (error) {
          console.error(error);

          mostrar(
            "Hay una asistencia pendiente de sincronización.\n\n" +
            error.message +
            "\n\nSe conservará en este teléfono para reintentar."
          );

          return;
        }
      }
    }


    // ==========================================
    // 12. REGISTRO AUTOMÁTICO DE LLEGADA
    // ==========================================

    async function registrarLlegada(usuario, dispositivo) {
      const registro = prepararRegistro(
        dispositivo,
        usuario.email
      );

      if (registro.sincronizado === true) {
        mostrar("Tu asistencia de hoy ya está registrada.");

        mostrarDetalle(
          "Correo: " + usuario.email +
          "\nFecha: " +
          new Date(registro.timestamp).toLocaleDateString("es-MX") +
          "\nHora de llegada: " +
          new Date(registro.timestamp).toLocaleTimeString("es-MX") +
          "\nTeléfono: " + obtenerTipoTelefono() +
          "\nEstado: Registrado"
        );

        return;
      }

      if (!navigator.onLine) {
        mostrar(
          "Asistencia guardada en este teléfono.\n\n" +
          "No hay conexión a internet. Se enviará al servidor " +
          "cuando vuelva la conexión."
        );

        mostrarDetalle(
          "Correo: " + usuario.email +
          "\nFecha: " +
          new Date(registro.timestamp).toLocaleDateString("es-MX") +
          "\nHora local: " +
          new Date(registro.timestamp).toLocaleTimeString("es-MX") +
          "\nEstado: Pendiente de sincronización"
        );

        return;
      }

      await sincronizarRegistro(
        usuario,
        dispositivo,
        registro
      );

      mostrar("¡Asistencia registrada correctamente!");

      mostrarDetalle(
        "Correo: " + usuario.email +
        "\nFecha: " +
        new Date(registro.timestamp).toLocaleDateString("es-MX") +
        "\nHora de llegada: " +
        new Date(registro.timestamp).toLocaleTimeString("es-MX") +
        "\nTeléfono: " + obtenerTipoTelefono() +
        "\nEstado: Registrado en el servidor"
      );
    }


    // ==========================================
    // 13. INICIAR CHECADOR
    // ==========================================

    async function iniciarChecador(usuario) {
      if (procesoEnCurso) return;

      procesoEnCurso = true;

      try {
        const dispositivo = obtenerDispositivo();

        if (!dispositivo) {
          mostrar(
            "Este teléfono no tiene una autorización local válida.\n\n" +
            "Primero inicia sesión desde la página de acceso."
          );

          setTimeout(() => {
            window.location.href = URL_ACCESO;
          }, 2000);

          return;
        }

        if (!navigator.onLine) {
          // En modo offline solo se permite guardar una asistencia
          // si ya existe una sesión Firebase y una autorización local.
          const registro = prepararRegistro(
            dispositivo,
            usuario.email
          );

          if (registro.sincronizado) {
            mostrar("Tu asistencia de hoy ya está registrada.");
            return;
          }

          mostrar(
            "Sin conexión a internet.\n\n" +
            "La asistencia se ha guardado localmente y quedará " +
            "pendiente de validación y sincronización."
          );

          mostrarDetalle(
            "Correo: " + usuario.email +
            "\nHora local: " +
            new Date(registro.timestamp).toLocaleTimeString("es-MX") +
            "\nEstado: Pendiente"
          );

          return;
        }

        await validarTelefono(usuario, dispositivo);

        await sincronizarPendientes(usuario, dispositivo);

        await registrarLlegada(usuario, dispositivo);

      } catch (error) {
        console.error(error);

        mostrar(
          "No se pudo completar el registro.\n\n" +
          error.message
        );

      } finally {
        procesoEnCurso = false;
      }
    }


    // ==========================================
    // 14. RECONOCER SESIÓN FIREBASE
    // ==========================================

    onAuthStateChanged(auth, usuario => {
      usuarioActual = usuario;

      if (!usuario) {
        mostrar(
          "No hay una sesión institucional activa.\n\n" +
          "Abre primero la página de acceso."
        );

        setTimeout(() => {
          window.location.href = URL_ACCESO;
        }, 2000);

        return;
      }

      iniciarChecador(usuario);
    });


    // ==========================================
    // 15. RECUPERAR CONEXIÓN
    // ==========================================

    window.addEventListener("online", () => {
      if (usuarioActual) {
        iniciarChecador(usuarioActual);
      }
    });


    // ==========================================
    // 16. SERVICE WORKER
    // ==========================================

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js")
        .catch(error => {
          console.error("Service Worker:", error);
        });
    }

  </script>
</body>
</html>
