
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <title>Checador CUY - Acceso</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      background: #171717;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      width: 100%;
      max-width: 440px;
      padding: 28px;
      background: #242424;
      border: 1px solid #414141;
      border-radius: 16px;
    }

    h1 { font-size: 25px; }

    p { color: #c9c9c9; line-height: 1.5; }

    label { display: block; margin-top: 18px; }

    input {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: 1px solid #555;
      border-radius: 8px;
      background: #171717;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #d5a0b9;
      color: #171717;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .5; }

    #estado {
      margin-top: 22px;
      padding: 14px;
      border-radius: 8px;
      background: #333;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .pequeno { margin-top: 20px; font-size: 12px; color: #999; }
  </style>
</head>

<body>
<main>
  <h1>Checador CUY</h1>
  <p>Sistema de autenticación institucional y autorización de dispositivos móviles.</p>

  <div id="formulario">
    <label for="correo">Correo institucional</label>
    <input
      type="email"
      id="correo"
      placeholder="docente@colegiodeyahualica.edu.mx"
      autocomplete="email"
    >
    <button id="btnEnviar">Enviar enlace de acceso</button>
  </div>

  <div id="estado">Comprobando sesión...</div>

  <p class="pequeno">
    Colegio Universitario de Yahualica · Sistema de asistencia docente
  </p>
</main>

<script type="module">

/*************************************************
 * FIREBASE
 *************************************************/

import { initializeApp } from
  "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

import {
  getAuth,
  setPersistence,
  browserLocalPersistence,
  sendSignInLinkToEmail,
  isSignInWithEmailLink,
  signInWithEmailLink,
  onAuthStateChanged
} from
  "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAMLtZyqiUkME1HwiGSHOFF7wJ-UpmBbJI",
  authDomain: "checador-docente-cuy.firebaseapp.com",
  projectId: "checador-docente-cuy",
  storageBucket: "checador-docente-cuy.firebasestorage.app",
  messagingSenderId: "15127097699",
  appId: "1:15127097699:web:308aae0b17e363ad5b2356",
  measurementId: "G-BP8YEFQDJE"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);


/*************************************************
 * CONFIGURACIÓN
 *************************************************/

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyXlKZuyW8NkhM8Jwut84LDVXCQIsx-8Fa0wZ8Jkcdo57s3ZqAnD9Q0IOXgJvw9AKXY/exec";

const URL_PAGINA =
  "https://elhomidiaz-stack.github.io/checador-docente_cuy/prueba_firebase.html";

const URL_CHECADOR =
  "https://elhomidiaz-stack.github.io/checador-docente_cuy/index.html";

const CLAVE_CORREO = "firebase_correo_prueba";
const CLAVE_DISPOSITIVO = "checador_dispositivo_v1";

const estado = document.getElementById("estado");
const formulario = document.getElementById("formulario");
const botonEnviar = document.getElementById("btnEnviar");

let procesando = false;


/*************************************************
 * FUNCIONES GENERALES
 *************************************************/

function mostrar(mensaje) {
  estado.textContent = mensaje;
}

function generarUUID() {
  return crypto.randomUUID();
}

function generarTextoAleatorio(bytes) {
  const valores = new Uint8Array(bytes);
  crypto.getRandomValues(valores);

  let texto = "";

  valores.forEach(valor => {
    texto += String.fromCharCode(valor);
  });

  return btoa(texto)
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/g, "");
}

function identificarTipoTelefono() {
  const agente = navigator.userAgent || "";

  if (/iPhone|iPad|iPod/i.test(agente)) return "iPhone";
  if (/Android/i.test(agente)) return "Android";

  return "Otro dispositivo";
}


/*************************************************
 * IDENTIFICADOR DEL DISPOSITIVO
 *************************************************/

function obtenerDispositivo() {
  const guardado = localStorage.getItem(CLAVE_DISPOSITIVO);

  if (guardado) {
    try {
      const dispositivo = JSON.parse(guardado);

      if (dispositivo.id && dispositivo.token) {
        return dispositivo;
      }
    } catch (error) {
      console.error(error);
    }
  }

  const dispositivo = {
    id: generarTextoAleatorio(24),
    token: generarTextoAleatorio(32),
    estado: "pendiente"
  };

  localStorage.setItem(
    CLAVE_DISPOSITIVO,
    JSON.stringify(dispositivo)
  );

  return dispositivo;
}


/*************************************************
 * CONSULTAS JSONP
 *************************************************/

function consultarResultado(accion, solicitud) {
  return new Promise((resolve, reject) => {
    const callback = "respuesta_" +
      generarUUID().replace(/-/g, "");

    const script = document.createElement("script");
    let terminado = false;

    function limpiar() {
      clearTimeout(temporizador);
      delete window[callback];
      script.remove();
    }

    const temporizador = setTimeout(() => {
      if (terminado) return;

      terminado = true;
      limpiar();
      reject(new Error("Tiempo de espera agotado."));
    }, 10000);

    window[callback] = resultado => {
      if (terminado) return;

      terminado = true;
      limpiar();
      resolve(resultado);
    };

    const parametros = new URLSearchParams({
      action: accion,
      id: solicitud,
      callback
    });

    script.src = SCRIPT_URL + "?" + parametros.toString();

    script.onerror = () => {
      if (terminado) return;

      terminado = true;
      limpiar();
      reject(new Error("No se pudo consultar el servidor."));
    };

    document.body.appendChild(script);
  });
}


/*************************************************
 * ENVÍO POST Y ESPERA
 *************************************************/

async function enviarSolicitud(datos) {
  await fetch(SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {
      "Content-Type":
        "application/x-www-form-urlencoded;charset=UTF-8"
    },
    body: datos.toString()
  });
}

async function esperarResultado(accion, solicitud) {
  for (let intento = 0; intento < 15; intento++) {
    await new Promise(resolve => setTimeout(resolve, 1000));

    try {
      const resultado = await consultarResultado(
        accion,
        solicitud
      );

      if (resultado?.pendiente) continue;
      if (resultado) return resultado;

    } catch (error) {
      console.log(error.message);
    }
  }

  throw new Error("El servidor no confirmó la operación.");
}


/*************************************************
 * VALIDAR DISPOSITIVO YA AUTORIZADO
 *************************************************/

async function validarDispositivo(usuario, dispositivo) {
  mostrar("Comprobando autorización del teléfono...");

  const idToken = await usuario.getIdToken(true);
  const solicitud = generarUUID();

  const datos = new URLSearchParams({
    action: "validar_dispositivo",
    idToken,
    idDispositivo: dispositivo.id,
    tokenDispositivo: dispositivo.token,
    tipoDispositivo: identificarTipoTelefono(),
    solicitud
  });

  await enviarSolicitud(datos);

  const resultado = await esperarResultado(
    "resultado_validacion_dispositivo",
    solicitud
  );

  if (
    !resultado ||
    resultado.ok !== true ||
    resultado.autorizado !== true
  ) {
    throw new Error(
      resultado?.mensaje || "Este teléfono no está autorizado."
    );
  }

  return resultado;
}


/*************************************************
 * VINCULAR TELÉFONO NUEVO
 *************************************************/

async function vincularDispositivo(usuario, dispositivo) {
  mostrar("Solicitando autorización del teléfono...");

  const idToken = await usuario.getIdToken(true);
  const solicitud = generarUUID();

  const datos = new URLSearchParams({
    action: "vincular_dispositivo",
    idToken,
    idDispositivo: dispositivo.id,
    tokenDispositivo: dispositivo.token,
    tipoDispositivo: identificarTipoTelefono(),
    solicitud
  });

  await enviarSolicitud(datos);

  const resultado = await esperarResultado(
    "resultado_vinculacion",
    solicitud
  );

  if (
    !resultado ||
    resultado.ok !== true ||
    resultado.autorizado !== true
  ) {
    throw new Error(
      resultado?.mensaje || "No fue posible autorizar este teléfono."
    );
  }

  return resultado;
}


/*************************************************
 * PROCESAR SESIÓN Y ENTRAR AL CHECADOR
 *************************************************/

async function procesarUsuario(usuario) {
  if (procesando) return;

  procesando = true;
  formulario.style.display = "none";

  try {
    const tipo = identificarTipoTelefono();

    // No permitir vincular computadoras.
    if (tipo === "Otro dispositivo") {
      throw new Error(
        "El checador solo permite teléfonos Android o iPhone. " +
        "No se autorizó este dispositivo."
      );
    }

    const dispositivo = obtenerDispositivo();
    let resultado;

    if (dispositivo.estado === "autorizado") {
      resultado = await validarDispositivo(usuario, dispositivo);
    } else {
      resultado = await vincularDispositivo(usuario, dispositivo);
    }

    dispositivo.estado = "autorizado";

    localStorage.setItem(
      CLAVE_DISPOSITIVO,
      JSON.stringify(dispositivo)
    );

    mostrar(
      "¡Teléfono autorizado correctamente!\n\n" +
      "Correo: " + (resultado.correo || usuario.email) +
      "\nNombre: " + (resultado.nombre || "") +
      "\nDispositivo: " + tipo +
      "\n\nAbriendo el checador..."
    );

    // Entrar automáticamente después de validar.
    setTimeout(() => {
      window.location.replace(URL_CHECADOR);
    }, 1000);

  } catch (error) {
    console.error(error);

    mostrar(
      "No se pudo completar el acceso.\n\n" +
      error.message
    );

    formulario.style.display = "block";

  } finally {
    procesando = false;
  }
}


/*************************************************
 * ENVIAR ENLACE DE ACCESO
 *************************************************/

botonEnviar.addEventListener("click", async () => {
  const correo = document
    .getElementById("correo")
    .value.trim()
    .toLowerCase();

  if (!correo || !correo.includes("@")) {
    mostrar("Escribe un correo electrónico válido.");
    return;
  }

  if (identificarTipoTelefono() === "Otro dispositivo") {
    mostrar("El acceso y la autorización se realizan desde un teléfono.");
    return;
  }

  botonEnviar.disabled = true;
  mostrar("Enviando enlace de acceso...");

  try {
    await sendSignInLinkToEmail(auth, correo, {
      url: URL_PAGINA,
      handleCodeInApp: true
    });

    localStorage.setItem(CLAVE_CORREO, correo);

    mostrar(
      "Enlace enviado correctamente a:\n\n" +
      correo +
      "\n\nAbre el enlace en este mismo teléfono."
    );

  } catch (error) {
    console.error(error);
    mostrar("No se pudo enviar el enlace.\n\n" + error.message);

  } finally {
    botonEnviar.disabled = false;
  }
});


/*************************************************
 * COMPLETAR AUTENTICACIÓN POR ENLACE
 *************************************************/

async function comprobarEnlace() {
  if (!isSignInWithEmailLink(auth, window.location.href)) {
    return;
  }

  let correo = localStorage.getItem(CLAVE_CORREO);

  if (!correo) {
    correo = window.prompt(
      "Confirma el correo al que recibiste el enlace:"
    );
  }

  if (!correo) {
    mostrar("No se indicó el correo para completar el acceso.");
    return;
  }

  try {
    mostrar("Verificando enlace de acceso...");

    await signInWithEmailLink(
      auth,
      correo,
      window.location.href
    );

    localStorage.removeItem(CLAVE_CORREO);

    window.history.replaceState(
      {},
      document.title,
      URL_PAGINA
    );

  } catch (error) {
    console.error(error);
    mostrar("No se pudo completar la autenticación.\n\n" + error.message);
  }
}


/*************************************************
 * INICIO SEGURO DE FIREBASE
 *************************************************/

async function iniciar() {
  try {
    // Mantener la sesión al cambiar entre index y acceso.
    await setPersistence(auth, browserLocalPersistence);

    onAuthStateChanged(auth, usuario => {
      if (usuario) {
        procesarUsuario(usuario);
      } else {
        formulario.style.display = "block";

        if (!isSignInWithEmailLink(auth, window.location.href)) {
          mostrar("Inicia sesión con tu correo institucional.");
        }
      }
    });

    await comprobarEnlace();

  } catch (error) {
    console.error(error);
    mostrar("No se pudo iniciar Firebase.\n\n" + error.message);
  }
}

iniciar();

</script>
</body>
</html>
