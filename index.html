
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <meta name="description" content="Sistema de asistencia docente del Colegio Universitario de Yahualica">
  <link rel="manifest" href="./manifest.json">
  <title>Checador docente CUY</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 22px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #171717;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 460px;
      padding: 28px;
      background: #242424;
      border: 1px solid #414141;
      border-radius: 17px;
    }

    h1 { font-size: 25px; }

    p {
      color: #c9c9c9;
      line-height: 1.5;
    }

    .estado, .detalle {
      margin-top: 20px;
      padding: 17px;
      background: #333;
      border-radius: 10px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .oculto { display: none !important; }

    .boton {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 16px;
      border: 0;
      border-radius: 10px;
      background: #e5e5e5;
      color: #171717;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .boton.secundario {
      background: #454545;
      color: white;
      border: 1px solid #777;
    }

    .boton:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .aviso {
      margin-top: 18px;
      padding: 13px;
      border: 1px solid #806b31;
      border-radius: 9px;
      background: #3a321f;
      color: #f3dfa2;
      font-size: 13px;
      line-height: 1.5;
    }

    .etiqueta {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 6px;
      background: #806b31;
      color: #fff1bd;
      font-size: 11px;
      font-weight: bold;
    }

    .pie {
      margin-top: 22px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>
<main>
  <span class="etiqueta">MODO DE PRUEBA</span>

  <h1>Checador CUY</h1>

  <p>Sistema institucional de registro de asistencia docente.</p>

  <div id="estado" class="estado">Iniciando checador...</div>

  <button id="botonValidar" class="boton secundario oculto">
    Verificar autorización en servidor
  </button>

  <button id="botonLlegada" class="boton oculto">
    Simular llegada
  </button>

  <div id="detalle" class="detalle oculto"></div>

  <div class="aviso">
    Las simulaciones se guardan únicamente en este teléfono.
    No se envían a los registros oficiales.
  </div>

  <p class="pie">
    Colegio Universitario de Yahualica · Control de asistencia
  </p>
</main>

<script type="module">

/*************************************************
 * CONFIGURACIÓN
 *************************************************/

import { initializeApp } from
  "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAMLtZyqiUkME1HwiGSHOFF7wJ-UpmBbJI",
  authDomain: "checador-docente-cuy.firebaseapp.com",
  projectId: "checador-docente-cuy",
  storageBucket: "checador-docente-cuy.firebasestorage.app",
  messagingSenderId: "15127097699",
  appId: "1:15127097699:web:308aae0b17e363ad5b2356",
  measurementId: "G-BP8YEFQDJE"
};

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyXlKZuyW8NkhM8Jwut84LDVXCQIsx-8Fa0wZ8Jkcdo57s3ZqAnD9Q0IOXgJvw9AKXY/exec";

const URL_ACCESO = "./prueba_firebase.html";
const CLAVE_DISPOSITIVO = "checador_dispositivo_v1";

const DB_NOMBRE = "ChecadorCUY";
const DB_VERSION = 1;

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const estado = document.getElementById("estado");
const detalle = document.getElementById("detalle");
const botonValidar = document.getElementById("botonValidar");
const botonLlegada = document.getElementById("botonLlegada");

let usuarioActual = null;
let dispositivoActual = null;
let baseDatos = null;
let procesoEnCurso = false;


/*************************************************
 * INTERFAZ
 *************************************************/

function mostrar(mensaje) {
  estado.textContent = mensaje;
}

function mostrarDetalle(mensaje) {
  detalle.textContent = mensaje;
  detalle.classList.remove("oculto");
}

function ocultarDetalle() {
  detalle.classList.add("oculto");
}

function generarUUID() {
  return crypto.randomUUID();
}

function obtenerTipoTelefono() {
  const agente = navigator.userAgent || "";

  if (/iPhone|iPad|iPod/i.test(agente)) return "iPhone";
  if (/Android/i.test(agente)) return "Android";

  return "Otro dispositivo";
}

function obtenerDispositivo() {
  try {
    const texto = localStorage.getItem(CLAVE_DISPOSITIVO);
    if (!texto) return null;

    const dispositivo = JSON.parse(texto);

    if (
      dispositivo.id &&
      dispositivo.token &&
      dispositivo.estado === "autorizado"
    ) {
      return dispositivo;
    }
  } catch (error) {
    console.error(error);
  }

  return null;
}


/*************************************************
 * INDEXEDDB
 *************************************************/

function abrirBaseDatos() {
  return new Promise((resolve, reject) => {
    const solicitud = indexedDB.open(DB_NOMBRE, DB_VERSION);

    solicitud.onupgradeneeded = event => {
      const db = event.target.result;

      if (!db.objectStoreNames.contains("pruebas")) {
        db.createObjectStore("pruebas", {
          keyPath: "idRegistro"
        });
      }

      if (!db.objectStoreNames.contains("pendientes")) {
        db.createObjectStore("pendientes", {
          keyPath: "idRegistro"
        });
      }
    };

    solicitud.onsuccess = () => resolve(solicitud.result);
    solicitud.onerror = () => reject(solicitud.error);
  });
}

function guardarLocal(almacen, registro) {
  return new Promise((resolve, reject) => {
    const tx = baseDatos.transaction(almacen, "readwrite");
    tx.objectStore(almacen).put(registro);

    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

function obtenerLocal(almacen, id) {
  return new Promise((resolve, reject) => {
    const tx = baseDatos.transaction(almacen, "readonly");
    const solicitud = tx.objectStore(almacen).get(id);

    solicitud.onsuccess = () => resolve(solicitud.result || null);
    solicitud.onerror = () => reject(solicitud.error);
  });
}


/*************************************************
 * FECHA E IDENTIFICADOR
 *************************************************/

function obtenerFechaMexico() {
  const partes = new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/Mexico_City",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(new Date());

  const valores = {};

  partes.forEach(parte => {
    valores[parte.type] = parte.value;
  });

  return valores.year + valores.month + valores.day;
}

function crearIdRegistro() {
  return dispositivoActual.id + obtenerFechaMexico();
}


/*************************************************
 * CONSULTA JSONP
 *************************************************/

function consultarServidor(accion, solicitud) {
  return new Promise((resolve, reject) => {
    const callback = "cuy_" + generarUUID().replace(/-/g, "");
    const script = document.createElement("script");
    let terminado = false;

    function limpiar() {
      clearTimeout(temporizador);
      delete window[callback];
      script.remove();
    }

    const temporizador = setTimeout(() => {
      if (terminado) return;
      terminado = true;
      limpiar();
      reject(new Error("Tiempo de espera agotado."));
    }, 10000);

    window[callback] = resultado => {
      if (terminado) return;
      terminado = true;
      limpiar();
      resolve(resultado);
    };

    const parametros = new URLSearchParams({
      action: accion,
      id: solicitud,
      callback
    });

    script.src = SCRIPT_URL + "?" + parametros.toString();

    script.onerror = () => {
      if (terminado) return;
      terminado = true;
      limpiar();
      reject(new Error("No se pudo consultar el servidor."));
    };

    document.body.appendChild(script);
  });
}


/*************************************************
 * ENVÍO POST
 *************************************************/

async function enviarSolicitud(datos) {
  await fetch(SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {
      "Content-Type":
        "application/x-www-form-urlencoded;charset=UTF-8"
    },
    body: datos.toString()
  });
}

async function esperarResultado(accion, solicitud) {
  for (let intento = 0; intento < 15; intento++) {
    await new Promise(resolve => setTimeout(resolve, 1000));

    try {
      const resultado = await consultarServidor(accion, solicitud);

      if (resultado?.pendiente) continue;
      if (resultado) return resultado;

    } catch (error) {
      console.log("Esperando respuesta:", error.message);
    }
  }

  throw new Error("El servidor no confirmó la operación.");
}


/*************************************************
 * VALIDACIÓN REAL DEL DISPOSITIVO
 *************************************************/

async function validarTelefono() {
  if (!navigator.onLine) {
    throw new Error("No hay conexión a internet.");
  }

  const idToken = await usuarioActual.getIdToken(true);
  const solicitud = generarUUID();

  const datos = new URLSearchParams({
    action: "validar_dispositivo",
    idToken,
    idDispositivo: dispositivoActual.id,
    tokenDispositivo: dispositivoActual.token,
    tipoDispositivo: obtenerTipoTelefono(),
    solicitud
  });

  await enviarSolicitud(datos);

  return await esperarResultado(
    "resultado_validacion_dispositivo",
    solicitud
  );
}


/*************************************************
 * BOTÓN DE DIAGNÓSTICO
 *************************************************/

async function verificarServidor() {
  if (procesoEnCurso) return;

  procesoEnCurso = true;
  botonValidar.disabled = true;
  botonLlegada.disabled = true;
  ocultarDetalle();

  try {
    mostrar("Consultando autorización con el servidor...");

    const resultado = await validarTelefono();

    if (
      !resultado ||
      resultado.ok !== true ||
      resultado.autorizado !== true
    ) {
      throw new Error(
        resultado?.mensaje || "El servidor no autorizó este teléfono."
      );
    }

    mostrar(
      "¡Validación remota exitosa!\n\n" +
      "El servidor reconoce este teléfono como autorizado."
    );

    mostrarDetalle(
      "Correo: " + resultado.correo +
      "\nNombre: " + resultado.nombre +
      "\nDispositivo: " + resultado.tipoDispositivo +
      "\nEstado: Autorizado por el servidor" +
      "\n\nNo se creó ninguna asistencia."
    );

  } catch (error) {
    mostrar(
      "No se pudo validar el teléfono con el servidor.\n\n" +
      error.message
    );

  } finally {
    procesoEnCurso = false;
    botonValidar.disabled = false;
    botonLlegada.disabled = false;
  }
}


/*************************************************
 * SIMULACIÓN LOCAL
 *************************************************/

async function simularLlegada() {
  if (procesoEnCurso) return;

  procesoEnCurso = true;
  botonLlegada.disabled = true;
  ocultarDetalle();

  try {
    const idRegistro = crearIdRegistro();

    const existente = await obtenerLocal("pruebas", idRegistro);

    if (existente) {
      mostrar("Ya existe una simulación guardada para hoy.");

      mostrarDetalle(
        "Correo: " + existente.correo +
        "\nHora: " +
        new Date(existente.timestamp).toLocaleTimeString("es-MX") +
        "\nEstado: Simulación local"
      );

      return;
    }

    const registro = {
      idRegistro,
      correo: usuarioActual.email,
      timestamp: Date.now(),
      tipoDispositivo: obtenerTipoTelefono(),
      modo: "PRUEBA_LOCAL",
      sincronizado: false
    };

    await guardarLocal("pruebas", registro);

    mostrar(
      "Simulación guardada correctamente.\n\n" +
      "Este registro permanece únicamente en este teléfono."
    );

    mostrarDetalle(
      "Correo: " + registro.correo +
      "\nFecha: " +
      new Date(registro.timestamp).toLocaleDateString("es-MX") +
      "\nHora: " +
      new Date(registro.timestamp).toLocaleTimeString("es-MX") +
      "\nDispositivo: " + registro.tipoDispositivo +
      "\nDestino: IndexedDB local" +
      "\nEstado: No enviado a Google Sheets"
    );

  } catch (error) {
    mostrar("No se pudo guardar la simulación.\n\n" + error.message);

  } finally {
    procesoEnCurso = false;
    botonLlegada.disabled = false;
  }
}


/*************************************************
 * INICIO
 *************************************************/

async function iniciarAplicacion(usuario) {
  usuarioActual = usuario;

  botonValidar.classList.add("oculto");
  botonLlegada.classList.add("oculto");

  if (!usuario) {
    mostrar("No hay una sesión activa. Redirigiendo al acceso...");

    setTimeout(() => {
      window.location.href = URL_ACCESO;
    }, 1800);

    return;
  }

  try {
    baseDatos = await abrirBaseDatos();
    dispositivoActual = obtenerDispositivo();

    if (!dispositivoActual) {
      mostrar("Este teléfono no tiene autorización local.");

      setTimeout(() => {
        window.location.href = URL_ACCESO;
      }, 2500);

      return;
    }

    mostrar(
      "Sesión reconocida.\n\n" +
      "Correo: " + usuario.email +
      "\nDispositivo: " + obtenerTipoTelefono() +
      "\nConexión: " +
      (navigator.onLine ? "Disponible" : "Sin conexión") +
      "\n\nPuedes realizar una simulación local o verificar el servidor."
    );

    botonLlegada.textContent = "Simular llegada";
    botonLlegada.classList.remove("oculto");

    botonValidar.classList.remove("oculto");
    botonValidar.disabled = !navigator.onLine;

    const registro = await obtenerLocal(
      "pruebas",
      crearIdRegistro()
    );

    if (registro) {
      mostrarDetalle(
        "Simulación guardada anteriormente." +
        "\nCorreo: " + registro.correo +
        "\nHora: " +
        new Date(registro.timestamp).toLocaleTimeString("es-MX") +
        "\nEstado: Solo local"
      );
    }

  } catch (error) {
    mostrar("Error al iniciar: " + error.message);
  }
}


/*************************************************
 * EVENTOS
 *************************************************/

botonValidar.addEventListener("click", verificarServidor);
botonLlegada.addEventListener("click", simularLlegada);

window.addEventListener("online", () => {
  botonValidar.disabled = false;
  mostrar("Conexión recuperada. Las simulaciones siguen siendo locales.");
});

window.addEventListener("offline", () => {
  botonValidar.disabled = true;
  mostrar("Sin conexión. Las simulaciones locales siguen disponibles.");
});


/*************************************************
 * FIREBASE Y SERVICE WORKER
 *************************************************/

onAuthStateChanged(auth, iniciarAplicacion);

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js")
    .catch(error => console.error("Service Worker:", error));
}

</script>
</body>
</html>
