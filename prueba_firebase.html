
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba Firebase - Checador CUY</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      padding: 25px;
    }
    main {
      max-width: 430px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
    }
    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      box-sizing: border-box;
    }
    button {
      background: #1e40af;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    #estado {
      margin-top: 20px;
      padding: 12px;
      background: #eff6ff;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
<main>
  <h2>Prueba de acceso</h2>
  <p>Checador Docente CUY</p>

  <input id="correo" type="email"
    placeholder="Tu correo electrónico">

  <button id="enviar">Enviar enlace de acceso</button>

  <div id="estado">Esperando...</div>
</main>

<script type="module">
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

  import {
    getAuth,
    sendSignInLinkToEmail,
    isSignInWithEmailLink,
    signInWithEmailLink
  } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAMLtZyqiUkME1HwiGSHOFFw7j-UpmBbJI",
    authDomain: "checador-docente-cuy.firebaseapp.com",
    projectId: "checador-docente-cuy",
    storageBucket: "checador-docente-cuy.firebasestorage.app",
    messagingSenderId: "15127097699",
    appId: "1:15127097699:web:308aae0b17e363ad5b2356",
    measurementId: "G-BP8YEFQDJE"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const estado = document.getElementById("estado");
  const boton = document.getElementById("enviar");
  const CLAVE = "firebase_correo_prueba";

  const configuracionEnlace = {
    url: "https://elhomidiaz-stack.github.io/checador-docente_cuy/prueba_firebase.html",
    handleCodeInApp: true
  };

  boton.addEventListener("click", async () => {
    const correo = document.getElementById("correo")
      .value.trim().toLowerCase();

    if (!correo) {
      estado.textContent = "Escribe tu correo.";
      return;
    }

    try {
      boton.disabled = true;
      await sendSignInLinkToEmail(
        auth, correo, configuracionEnlace
      );

      localStorage.setItem(CLAVE, correo);
      estado.textContent =
        "Enlace enviado. Revisa tu correo electrónico.";
    } catch (error) {
      estado.textContent =
        "Error: " + error.code + " — " + error.message;
    } finally {
      boton.disabled = false;
    }
  });

  async function comprobarEnlace() {
    if (!isSignInWithEmailLink(auth, window.location.href)) {
      return;
    }

    let correo = localStorage.getItem(CLAVE);

    if (!correo) {
      correo = prompt(
        "Por seguridad, escribe el mismo correo al que enviamos el enlace:"
      );
    }

    if (!correo) {
      estado.textContent = "No se proporcionó el correo.";
      return;
    }

    try {
      const resultado = await signInWithEmailLink(
        auth, correo, window.location.href
      );

      localStorage.removeItem(CLAVE);
      estado.textContent =
        "¡Acceso verificado! Correo: " +
        resultado.user.email;
      window.history.replaceState(
        {}, document.title, window.location.pathname
      );
    } catch (error) {
      estado.textContent =
        "Error al verificar: " +
        error.code + " — " + error.message;
    }
  }

  comprobarEnlace();
</script>
</body>
</html>
