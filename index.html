
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#176b45">
<link rel="manifest" href="./manifest.json">
<title>Control de asistencia CUY</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #edf1f5;
  font-family: Arial, sans-serif;
}

.card {
  width: 100%;
  max-width: 390px;
  background: white;
  border-radius: 18px;
  padding: 30px 24px;
  text-align: center;
  box-shadow: 0 5px 25px #00000015;
}

.icon { font-size: 48px; }
h1 { color: #202c35; font-size: 24px; }

p {
  color: #777;
  font-size: 14px;
  line-height: 1.5;
}

input, button {
  width: 100%;
  padding: 15px;
  border-radius: 9px;
  font-size: 16px;
  margin-top: 12px;
}

input { border: 1px solid #ccc; }

button {
  border: none;
  background: #176b45;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:disabled { opacity: .5; }

.secundario {
  background: white;
  border: 1px solid #176b45;
  color: #176b45;
}

#mensaje {
  margin-top: 20px;
  padding: 15px;
  border-radius: 10px;
  white-space: pre-line;
  font-size: 14px;
  display: none;
}

.exito {
  display: block !important;
  background: #e2f5e9;
  color: #176b45;
}

.pendiente {
  display: block !important;
  background: #fff1d5;
  color: #875900;
}

.error {
  display: block !important;
  background: #ffe5e5;
  color: #a02020;
}

.pie {
  margin-top: 25px;
  font-size: 11px;
  color: #999;
}
</style>
</head>

<body>

<div class="card">

  <div class="icon">📲</div>
  <h1>Control de asistencia</h1>
  <p>Colegio Universitario de Yahualica</p>

  <div id="formulario">
    <p>Ingresa tu correo institucional la primera vez.</p>

    <input
      type="email"
      id="correo"
      placeholder="correo@colegio.edu.mx"
      autocomplete="email"
    >

    <button id="btnGuardar" onclick="guardarCorreo()">
      Guardar correo y registrar
    </button>
  </div>

  <div id="mensaje" role="status" aria-live="polite"></div>

  <button class="secundario" onclick="sincronizar()">
    Sincronizar pendientes
  </button>

  <button class="secundario" onclick="cambiarCorreo()">
    Cambiar correo
  </button>

  <div class="pie" id="estado">
    Sistema de asistencia NFC
  </div>

</div>

<script>

// ================================================
// CONFIGURACIÓN
// ================================================

const SCRIPT_URL =
'https://script.google.com/macros/s/AKfycbyXlKZuyW8NkhM8Jwut84LDVXCQIsx-8Fa0wZ8Jkcdo57s3ZqAnD9Q0IOXgJvw9AKXY/exec';

const CLAVE_CORREO = 'cuy_correo';

const DB_NOMBRE = 'ChecadorCUY';
const DB_VERSION = 1;

let db = null;
let sincronizando = false;


// ================================================
// BASE DE DATOS LOCAL INDEXEDDB
// ================================================

function abrirDB() {

  return new Promise((resolve, reject) => {

    const solicitud = indexedDB.open(
      DB_NOMBRE,
      DB_VERSION
    );

    solicitud.onupgradeneeded = event => {

      const base = event.target.result;

      if (!base.objectStoreNames.contains('pendientes')) {
        base.createObjectStore(
          'pendientes',
          { keyPath: 'id' }
        );
      }

      if (!base.objectStoreNames.contains('historial')) {
        base.createObjectStore(
          'historial',
          { keyPath: 'id' }
        );
      }
    };

    solicitud.onsuccess = () => {
      db = solicitud.result;
      resolve(db);
    };

    solicitud.onerror = () => {
      reject(solicitud.error);
    };

  });
}


function obtenerTodos(nombre) {

  return new Promise((resolve, reject) => {

    const transaccion = db.transaction(
      nombre,
      'readonly'
    );

    const solicitud = transaccion
      .objectStore(nombre)
      .getAll();

    solicitud.onsuccess = () => resolve(
      solicitud.result || []
    );

    solicitud.onerror = () => reject(
      solicitud.error
    );

  });
}


function guardarPendiente(registro) {

  return new Promise((resolve, reject) => {

    const transaccion = db.transaction(
      'pendientes',
      'readwrite'
    );

    transaccion.objectStore('pendientes')
      .put(registro);

    transaccion.oncomplete = resolve;
    transaccion.onerror = () => reject(
      transaccion.error
    );

  });
}


function moverAHistorial(registro) {

  return new Promise((resolve, reject) => {

    const transaccion = db.transaction(
      ['pendientes', 'historial'],
      'readwrite'
    );

    transaccion.objectStore('historial')
      .put(registro);

    transaccion.objectStore('pendientes')
      .delete(registro.id);

    transaccion.oncomplete = resolve;
    transaccion.onerror = () => reject(
      transaccion.error
    );

  });
}


// ================================================
// FUNCIONES GENERALES
// ================================================

function mostrar(texto, tipo) {

  const elemento = document.getElementById('mensaje');

  elemento.textContent = texto;
  elemento.className = tipo;
}


function fechaLocal(iso) {

  const partes = new Intl.DateTimeFormat(
    'en-CA',
    {
      timeZone: 'America/Mexico_City',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit'
    }
  ).formatToParts(new Date(iso));

  const valores = {};

  partes.forEach(p => {
    valores[p.type] = p.value;
  });

  return valores.year + '-' +
    valores.month + '-' + valores.day;
}


function horaLocal(iso) {

  return new Intl.DateTimeFormat(
    'es-MX',
    {
      timeZone: 'America/Mexico_City',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false
    }
  ).format(new Date(iso));
}


function dispositivo() {

  const ua = navigator.userAgent;

  let equipo = 'Otro';

  if (/Android/i.test(ua)) {
    equipo = 'Android';
  } else if (/iPhone|iPad|iPod/i.test(ua)) {
    equipo = 'iPhone/iPad';
  } else if (/Windows/i.test(ua)) {
    equipo = 'Windows';
  } else if (/Macintosh/i.test(ua)) {
    equipo = 'Mac';
  }

  return equipo;
}


// ================================================
// GUARDAR CORREO
// ================================================

async function guardarCorreo() {

  const correo = document.getElementById('correo')
    .value.trim().toLowerCase();

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) {

    mostrar('Ingresa un correo válido.', 'error');
    return;
  }

  try {

    await abrirDB();

    localStorage.setItem(CLAVE_CORREO, correo);

    document.getElementById('formulario')
      .style.display = 'none';

    await crearRegistro(correo);

  } catch (error) {

    mostrar(
      'No se pudo preparar el almacenamiento del teléfono.',
      'error'
    );

  }
}


// ================================================
// CREAR REGISTRO AL ABRIR EL NFC
// ================================================

async function crearRegistro(correo) {

  try {

    // La hora se captura inmediatamente.
    const instante = new Date().toISOString();

    const dia = fechaLocal(instante);

    const pendientes = await obtenerTodos('pendientes');
    const historial = await obtenerTodos('historial');

    const existe = [...pendientes, ...historial]
      .some(registro =>
        registro.correo === correo &&
        fechaLocal(registro.instante) === dia
      );

    if (existe) {

      mostrar(
        'Tu asistencia de hoy ya fue registrada o está pendiente.',
        'pendiente'
      );

      await sincronizar();
      return;
    }

    const registro = {
      id: crypto.randomUUID(),
      correo: correo,
      instante: instante,
      dispositivo: dispositivo()
    };

    // Guardar antes de intentar conectarse.
    await guardarPendiente(registro);

    mostrar(
      '¡ESCANEO REGISTRADO!\n\n' +
      'Correo: ' + correo + '\n' +
      'Fecha: ' + dia + '\n' +
      'Hora del escaneo: ' + horaLocal(instante) +
      '\n\n' +
      (navigator.onLine
        ? 'Enviando asistencia...'
        : 'Guardado sin internet. Se enviará al reconectarse.'),
      'pendiente'
    );

    actualizarEstado();

    if (navigator.onLine) {
      await sincronizar();
    }

  } catch (error) {

    mostrar(
      'No se pudo guardar la asistencia localmente. ' +
      'No cierres la página e intenta nuevamente.',
      'error'
    );

  }
}


// ================================================
// ENVIAR REGISTRO A GOOGLE SHEETS
// ================================================

function enviarRegistro(registro) {

  return new Promise((resolve, reject) => {

    const callback = 'cuyRespuesta_' +
      Math.random().toString(36).slice(2);

    const script = document.createElement('script');

    let terminado = false;

    let timeout;

    function limpiar() {

      delete window[callback];

      script.remove();

      clearTimeout(timeout);
    }

    window[callback] = respuesta => {

      if (terminado) return;

      terminado = true;

      limpiar();

      resolve(respuesta);
    };

    const parametros = new URLSearchParams({

      accion: 'registrar',

      callback: callback,

      id: registro.id,

      correo: registro.correo,

      instante: registro.instante,

      dispositivo: registro.dispositivo,

      _: String(Date.now())

    });

    script.src = SCRIPT_URL + '?' + parametros.toString();

    script.onerror = () => {

      if (terminado) return;

      terminado = true;

      limpiar();

      reject(new Error('Error de conexión.'));
    };

    timeout = setTimeout(() => {

      if (terminado) return;

      terminado = true;

      limpiar();

      reject(new Error('Tiempo de espera agotado.'));

    }, 20000);

    document.head.appendChild(script);

  });
}


// ================================================
// SINCRONIZAR PENDIENTES AUTOMÁTICAMENTE
// ================================================

async function sincronizar() {

  if (sincronizando || !navigator.onLine || !db) {
    return;
  }

  sincronizando = true;

  try {

    const pendientes = await obtenerTodos('pendientes');

    for (const registro of pendientes) {

      if (!navigator.onLine) break;

      let respuesta;

      try {

        respuesta = await enviarRegistro(registro);

      } catch (error) {

        break;
      }

      if (
        respuesta.estado === 'exito' ||
        respuesta.estado === 'duplicado'
      ) {

        // Mover el registro en una sola transacción.
        await moverAHistorial(registro);

        mostrar(
          respuesta.estado === 'exito'
            ? '¡ASISTENCIA REGISTRADA EN CUY!\n\n' +
              'Correo: ' + respuesta.correo + '\n' +
              'Fecha: ' + respuesta.fecha + '\n' +
              'Hora original: ' + respuesta.hora
            : 'Tu asistencia ya estaba registrada en el servidor.\n' +
              'Fecha: ' + respuesta.fecha +
              '\nHora: ' + respuesta.hora,
          'exito'
        );

      } else {

        mostrar(
          respuesta.mensaje || 'No se pudo registrar la asistencia.',
          'error'
        );

        break;
      }
    }

  } catch (error) {

    console.error(error);

    mostrar(
      'No se pudo completar la sincronización.',
      'pendiente'
    );

  } finally {

    sincronizando = false;

    actualizarEstado();
  }
}


// ================================================
// ESTADO DEL SISTEMA
// ================================================

async function actualizarEstado() {

  if (!db) return;

  try {

    const pendientes = await obtenerTodos('pendientes');

    document.getElementById('estado').textContent =
      pendientes.length
        ? pendientes.length + ' asistencia(s) pendiente(s)'
        : navigator.onLine
          ? 'Todos los registros sincronizados'
          : 'Sin conexión a internet';

  } catch (error) {

    console.error(error);
  }
}


// ================================================
// CAMBIAR CORREO
// ================================================

function cambiarCorreo() {

  if (!confirm(
    '¿Quieres cambiar el correo de este dispositivo?'
  )) {
    return;
  }

  localStorage.removeItem(CLAVE_CORREO);

  document.getElementById('formulario')
    .style.display = 'block';

  document.getElementById('correo').value = '';

  mostrar(
    'Ingresa el nuevo correo institucional.',
    'pendiente'
  );
}


// ================================================
// EVENTOS AUTOMÁTICOS
// ================================================

window.addEventListener('online', () => {

  sincronizar();
  actualizarEstado();

});

window.addEventListener('offline', () => {

  actualizarEstado();

});

document.addEventListener('visibilitychange', () => {

  if (!document.hidden) {
    sincronizar();
    actualizarEstado();
  }

});


// ================================================
// INICIAR APLICACIÓN
// ================================================

window.addEventListener('load', async () => {

  try {

    await abrirDB();

    if ('serviceWorker' in navigator) {

      navigator.serviceWorker.register('./sw.js')
        .catch(error => console.error(error));

    }

    actualizarEstado();

    const correo = localStorage.getItem(CLAVE_CORREO);

    if (correo) {

      document.getElementById('formulario')
        .style.display = 'none';

      await crearRegistro(correo);

    }

  } catch (error) {

    mostrar(
      'No se pudo iniciar el almacenamiento local.',
      'error'
    );

    console.error(error);
  }

});

</script>
</body>
</html>
